    wctx.beginPath(); wctx.moveTo(0, 0); wctx.lineTo(700, 0); wctx.stroke();
    wctx.setLineDash([]);
    wctx.restore();
  }
  wctx.restore();
}

/* ======================= COMPANION ======================= */
function mothership(cx, cy, s, t, firing, bayOpen){
  var c = wctx;
  c.save(); c.translate(cx, cy); c.scale(s, s);
  var lw = 1.7/s;
  var pulse = 0.5 + Math.sin(t*0.07)*0.5;

  // ---- ventral glow field ----
  var ug = c.createRadialGradient(0, 9, 2, 0, 9, 50);
  ug.addColorStop(0, rgba(COL.lime, 0.30 + pulse*0.25));
  ug.addColorStop(0.5, rgba(COL.lime, 0.09));
  ug.addColorStop(1, rgba(COL.lime, 0));
  c.fillStyle = ug;
  c.beginPath(); c.ellipse(0, 9, 50, 22, 0, 0, 6.283); c.fill();

  // ---- hull: swept manta shell ----
  var hg = c.createLinearGradient(0, -18, 0, 14);
  hg.addColorStop(0, '#445126');
  hg.addColorStop(0.42, '#1E2712');
  hg.addColorStop(1, '#070A04');
  c.fillStyle = hg;
  c.beginPath();
  c.moveTo(0, -17);
  c.bezierCurveTo(24, -16.5, 46, -8, 63, 1);
  c.bezierCurveTo(48, 5, 30, 3.5, 17, 9);
  c.quadraticCurveTo(0, 13.5, -17, 9);
  c.bezierCurveTo(-30, 3.5, -48, 5, -63, 1);
  c.bezierCurveTo(-46, -8, -24, -16.5, 0, -17);
  c.closePath(); c.fill();
  c.strokeStyle = COL.lime; c.lineWidth = lw*1.25; c.stroke();

  // leading-edge rim light
  c.strokeStyle = rgba(COL.paper, 0.4); c.lineWidth = lw*0.7;
  c.beginPath();
  c.moveTo(-58, -0.6);
  c.bezierCurveTo(-42, -8.5, -22, -15.5, 0, -16);
  c.bezierCurveTo(22, -15.5, 42, -8.5, 58, -0.6);
  c.stroke();

  // ---- chitinous ribs radiating from the core ----
  c.strokeStyle = 'rgba(0,0,0,0.42)'; c.lineWidth = lw*0.9;
  for(var r=-4;r<=4;r++){
    if(r === 0) continue;
    var sx = r*7;
    c.beginPath();
    c.moveTo(sx*0.55, -9);
    c.quadraticCurveTo(sx*1.4, -3, sx*2.0, 5.5);
    c.stroke();
  }
  // segment seams following the sweep
  c.strokeStyle = rgba(COL.dim, 0.55); c.lineWidth = lw*0.7;
  for(var q=1;q<=2;q++){
    c.beginPath();
    c.moveTo(-58*q/2.4, -2 - q*3);
    c.quadraticCurveTo(0, 4 - q*7, 58*q/2.4, -2 - q*3);
    c.stroke();
  }

  // ---- asymmetric sensor pod ----
  c.fillStyle = '#1B2210'; c.strokeStyle = COL.lime; c.lineWidth = lw;
  c.beginPath();
  c.ellipse(34, -6, 8, 4.2, -0.28, 0, 6.283);
  c.fill(); c.stroke();
  c.fillStyle = rgba(COL.lime, 0.55 + pulse*0.4);
  c.beginPath(); c.ellipse(36, -6.6, 2.6, 1.4, -0.28, 0, 6.283); c.fill();

  // ---- dorsal crest ----
  c.fillStyle = '#222B12'; c.strokeStyle = COL.lime; c.lineWidth = lw;
  c.beginPath();
  c.moveTo(-13, -14);
  c.quadraticCurveTo(0, -25, 13, -14);
  c.quadraticCurveTo(0, -17.5, -13, -14);
  c.closePath(); c.fill(); c.stroke();

  // ---- central eye ----
  var eyeR = 10;
  c.fillStyle = COL.ink;
  c.beginPath(); c.ellipse(0, -3, eyeR, eyeR*0.72, 0, 0, 6.283); c.fill();
  c.strokeStyle = COL.lime; c.lineWidth = lw*1.2; c.stroke();
  var eg = c.createRadialGradient(0, -3, 0.5, 0, -3, eyeR*0.8);
  eg.addColorStop(0, rgba(COL.paper, 0.95));
  eg.addColorStop(0.35, rgba(COL.lime, 0.85));
  eg.addColorStop(1, rgba(COL.lime, 0.12));
  c.fillStyle = eg;
  c.beginPath(); c.ellipse(0, -3, eyeR*0.78, eyeR*0.55, 0, 0, 6.283); c.fill();
  // iris shutters
  c.strokeStyle = rgba(COL.ink, 0.75); c.lineWidth = lw*1.1;
  for(var ir=0;ir<7;ir++){
    var ia = t*0.012 + ir*0.898;
    c.beginPath();
    c.moveTo(Math.cos(ia)*eyeR*0.28, -3 + Math.sin(ia)*eyeR*0.2);
    c.lineTo(Math.cos(ia)*eyeR*0.78, -3 + Math.sin(ia)*eyeR*0.55);
    c.stroke();
  }

  // ---- orbiting lamp ring ----
  for(var k=0;k<9;k++){
    var a = t*0.03 + k*0.698;
    var ox2 = Math.cos(a)*46, oy2 = -2 + Math.sin(a)*11;
    var depth = (Math.sin(a) + 1)/2;
    c.globalAlpha = 0.25 + depth*0.7;
    c.fillStyle = (k % 3 === 0) ? COL.paper : COL.lime;
    c.fillRect(ox2 - 1.3, oy2 - 1.3, 2.6, 2.6);
    c.globalAlpha = 1;
  }

  // ---- wingtip nodes ----
  for(var w=-1;w<=1;w+=2){
    c.fillStyle = rgba(w < 0 ? COL.red : COL.lime, 0.35 + pulse*0.6);
    c.beginPath(); c.arc(w*60, 0.6, 2.6, 0, 6.283); c.fill();
  }

  // ---- ventral iris bay ----
  var bo = bayOpen ? 1 : 0;
  c.strokeStyle = rgba(COL.lime, 0.75); c.lineWidth = lw;
  for(var b2=0;b2<3;b2++){
    var rr2 = 5 + b2*3.4 + bo*b2*2.4;
    c.beginPath(); c.ellipse(0, 9, rr2, rr2*0.42, 0, 0, 6.283); c.stroke();
  }
  if(bayOpen){
    var byg = c.createLinearGradient(0, 9, 0, 34);
    byg.addColorStop(0, rgba(COL.paper, 0.5));
    byg.addColorStop(1, rgba(COL.lime, 0));
    c.fillStyle = byg;
    c.beginPath();
    c.moveTo(-12, 10); c.lineTo(12, 10); c.lineTo(22, 34); c.lineTo(-22, 34);
    c.closePath(); c.fill();
  }

  // ---- charged wash along the trailing edge when firing ----
  if(firing){
    c.strokeStyle = rgba(COL.paper, 0.55); c.lineWidth = lw*2;
    c.beginPath();
    c.moveTo(-46, 4.5); c.quadraticCurveTo(0, 13, 46, 4.5);
    c.stroke();
  }
  c.restore();
}

function qbez(x0, y0, cx1, cy1, x1, y1, t){
  var u = 1 - t;
  return {x: u*u*x0 + 2*u*t*cx1 + t*t*x1, y: u*u*y0 + 2*u*t*cy1 + t*t*y1};
}

function cablePath(c, pts){
  c.beginPath();
  c.moveTo(pts[0].x, pts[0].y);
  for(var i=1;i<pts.length-1;i++){
    var xc = (pts[i].x + pts[i+1].x)/2, yc = (pts[i].y + pts[i+1].y)/2;
    c.quadraticCurveTo(pts[i].x, pts[i].y, xc, yc);
  }
  c.lineTo(pts[pts.length-1].x, pts[pts.length-1].y);
}

// screen-space point list -> drawn cable
function drawCable(pts){
  var c = wctx, n = pts.length;

  c.lineJoin = 'round'; c.lineCap = 'round';
  c.strokeStyle = 'rgba(3,5,2,0.95)'; c.lineWidth = 6.6; cablePath(c, pts); c.stroke();
  c.strokeStyle = '#2C3418';          c.lineWidth = 4.8; cablePath(c, pts); c.stroke();
  c.strokeStyle = rgba(COL.dim, 0.95);c.lineWidth = 3; cablePath(c, pts); c.stroke();
  c.strokeStyle = 'rgba(6,9,4,0.8)';  c.lineWidth = 1.2; cablePath(c, pts); c.stroke();
  c.lineJoin = 'miter'; c.lineCap = 'butt';

  // ribbed collars, banked to the local tangent
  for(var i=2;i<n-2;i+=3){
    var prev = pts[i-1], next = pts[i+1];
    var an = Math.atan2(next.y - prev.y, next.x - prev.x);
    c.save(); c.translate(pts[i].x, pts[i].y); c.rotate(an);
    c.fillStyle = '#3A4520';
    c.fillRect(-1, -3.4, 2, 6.8);
    c.strokeStyle = rgba(COL.lime, 0.32); c.lineWidth = 0.7;
    c.strokeRect(-1, -3.4, 2, 6.8);
    c.restore();
  }

  // couplers seated at each end, aligned with the cable
  for(var e=0;e<2;e++){
    var tip = e ? pts[n-1] : pts[0];
    var nb  = e ? pts[n-2] : pts[1];
    var ca = Math.atan2(nb.y - tip.y, nb.x - tip.x);
    c.save(); c.translate(tip.x, tip.y); c.rotate(ca);
    // collar seated against the hull/back plate
    c.fillStyle = '#1A200E'; c.strokeStyle = COL.lime; c.lineWidth = 1.3;
    c.beginPath();
    c.moveTo(-1.2, -3.2); c.lineTo(3.4, -3.8);
    c.lineTo(4.8, -2.5); c.lineTo(4.8, 2.5);
    c.lineTo(3.4, 3.8); c.lineTo(-1.2, 3.2);
    c.closePath(); c.fill(); c.stroke();
    c.fillStyle = rgba(COL.lime, 0.8);
    c.fillRect(1, -2, 1.2, 4);
    c.fillStyle = COL.dim;
    c.fillRect(3.1, -4.1, 1.3, 1.4);
    c.fillRect(3.1, 2.7, 1.3, 1.4);
    c.restore();
  }

  // charge pulses running toward the suit
  for(var k=0;k<3;k++){
    var tp = (((frame + k*30) % 90) / 90);
    var fi = tp*(n-1), i0 = Math.floor(fi), fr = fi - i0;
    if(i0 >= n-1) i0 = n-2, fr = 1;
    var px2 = pts[i0].x + (pts[i0+1].x - pts[i0].x)*fr;
    var py2 = pts[i0].y + (pts[i0+1].y - pts[i0].y)*fr;
    var fade = Math.sin(tp*Math.PI);
    c.globalAlpha = 0.3 + fade*0.7;
    c.fillStyle = COL.paper;
    c.beginPath(); c.arc(px2, py2, 2.4, 0, 6.283); c.fill();
    c.globalAlpha = 1;
    addLight(px2 + cam.x, py2, 32, COL.lime, 0.45*fade);
  }
}

// static sagging run, for the title screen where physics never ticks
function staticCable(ax, ay, bx2, by2, n){
  var pts = [], d = Math.abs(bx2-ax) + Math.abs(by2-ay);
  var sag = clamp(d*0.22, 8, 40);
  for(var i=0;i<n;i++){
    var t = i/(n-1);
    pts.push({x: ax + (bx2-ax)*t,
              y: ay + (by2-ay)*t + Math.sin(t*Math.PI)*sag});
  }
  return pts;
}
function drawPartner(){
  var q = partner;
  if(!q.active) return;
  var x = q.x - cam.x, y = q.y;
  var firing = q.cool > 26;

  // umbilical: simulated rope, anchored at the suit's dorsal port
  if(ropeReady && rope.length === ROPE_N){
    var sp = [];
    for(var i=0;i<ROPE_N;i++) sp.push({x: rope[i].x - cam.x, y: rope[i].y});
    drawCable(sp);
  }

  entShadow(q.x + 17, q.y + 12, 60, 0.55);
  mothership(x + 17, y + 8, 0.5, q.bob*9, firing, false);
  addLight(q.x + 6, q.y + 8, 52, COL.lime, 0.30);
  if(firing) addLight(q.x + 17, q.y + 4, 46, COL.paper, 0.35);

  wctx.strokeStyle = rgba(COL.dim, 0.6); wctx.lineWidth = 1;
  wctx.beginPath(); wctx.moveTo(x + 2, y - 6); wctx.lineTo(x + 12, y + 1); wctx.stroke();
  wctx.fillStyle = rgba(COL.mute, 0.9); wctx.font = '8px "IBM Plex Mono", monospace';
  wctx.fillText('IMPACT-1 // CARRIER', x - 46, y - 8);
}

/* ======================= PLAYER ======================= */
function robotSuit(o){
  var edge = o.edge, body = o.body, face = o.face;
  var c = wctx;
  var F = face;
  var wk = o.walk || 0;
  var grounded = (o.grounded !== false);
  var cxb = 13 + F*3.6;     // cephalothorax centre
  var axb = 13 - F*5.6;     // abdomen centre
  var BY = 25.6;            // body line
  var pulse = 0.3 + Math.abs(Math.sin(frame*0.045))*0.5;

  /* ---------------- thruster plumes off the abdomen ---------------- */
  if(o.thrust){
    var f = 6 + Math.abs(Math.sin(frame*0.5))*8;
    for(var n=0;n<2;n++){
      var nx = axb - F*(1.4 + n*2.6), ny = BY + 3.6;
      var pgr = c.createLinearGradient(nx, ny, nx, ny + f*1.8);
      pgr.addColorStop(0, rgba(COL.paper, 0.95));
      pgr.addColorStop(0.28, rgba(COL.lime, 0.85));
      pgr.addColorStop(1, rgba(COL.lime, 0));
      c.fillStyle = pgr;
      c.beginPath();
      c.moveTo(nx - 1.5, ny); c.lineTo(nx + 1.5, ny);
      c.lineTo(nx + 0.7 - F*1.6, ny + f*1.8);
      c.lineTo(nx - 0.7 - F*1.6, ny + f*1.8);
      c.closePath(); c.fill();
    }
  }

  /* ---------------- eight articulated legs ---------------- */
  // hips sit on the underside so the legs stay clear of the carapace
  var HIPY = BY + 2.6;
  var LEGS = [
    {kx:-5.2, ky:-2.4, fx:-9.2, ph:0.0},
    {kx:-1.8, ky:-3.4, fx:-3.6, ph:1.6},
    {kx: 2.4, ky:-3.4, fx: 3.2, ph:3.2},
    {kx: 5.4, ky:-2.4, fx: 9.0, ph:4.8}
  ];

  function drawLeg(L, near, phase){
    var th = wk*1.1 + phase;
    // lift over the first half of the cycle, and carry the foot forward while it is up
    var lift  = grounded ? Math.max(0, Math.sin(th))*3.4
                         : 7.5 + Math.sin(frame*0.06 + phase)*1.4;   // tucked in flight
    var swing = grounded ? -Math.cos(th)*2.6
                         : -1.2 + Math.sin(frame*0.05 + phase*1.3)*0.9;
    var curl  = grounded ? 1 : 0.62;   // legs draw inward when off the ground
    // the far bank sits back and slightly higher, so the two ranks read apart
    var dz  = near ? 0 : F*2.1;
    var dzy = near ? 0 : 1.4;
    var hx = cxb + F*L.kx*0.2 + dz, hy = HIPY - dzy*0.4;
    var kx2 = cxb + F*(L.kx + swing*0.3) + dz, ky2 = HIPY + L.ky - lift*0.3 - dzy*0.5;  // femur tip
    var fx2 = cxb + F*(L.fx*curl + swing) + dz, fy2 = 36 - lift - dzy;      // tarsus tip
    // extra joint: the tibia kicks outward before the foot turns back in
    var ax2 = cxb + F*(L.fx*1.2*curl + swing*0.75) + dz, ay2 = 32 - lift*0.5 - dzy*0.8;

    var lw = near ? 1.5 : 1.15;
    c.strokeStyle = near ? '#0A0E06' : '#070A04';
    c.lineWidth = lw; c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath();
    c.moveTo(hx, hy); c.lineTo(kx2, ky2); c.lineTo(ax2, ay2); c.lineTo(fx2, fy2);
    c.stroke();
    c.strokeStyle = near ? edge : rgba(edge, 0.4);
    c.lineWidth = near ? 0.68 : 0.5;
    c.beginPath();
    c.moveTo(hx, hy); c.lineTo(kx2, ky2); c.lineTo(ax2, ay2); c.lineTo(fx2, fy2);
    c.stroke();
    c.lineCap = 'butt'; c.lineJoin = 'miter';
    // tibial barbs
    if(near){
      var ba = Math.atan2(ay2 - ky2, ax2 - kx2);
      c.fillStyle = edge;
      for(var bq=1;bq<=2;bq++){
        var bpx = kx2 + (ax2 - kx2)*(bq/3), bpy = ky2 + (ay2 - ky2)*(bq/3);
        c.save(); c.translate(bpx, bpy); c.rotate(ba);
        c.beginPath();
        c.moveTo(-0.5, 0); c.lineTo(0.3, -0.95 * F); c.lineTo(0.55, 0);
        c.closePath(); c.fill();
        c.restore();
      }
      // tarsal joint
      c.fillStyle = edge;
      c.beginPath(); c.arc(ax2, ay2, 0.7, 0, 6.283); c.fill();
    }

    // femur plate
    var mx2 = (hx + kx2)/2, my2 = (hy + ky2)/2;
    var fa = Math.atan2(ky2 - hy, kx2 - hx);
    c.save(); c.translate(mx2, my2); c.rotate(fa);
    c.fillStyle = near ? body : '#0B0F06';
    c.strokeStyle = near ? edge : rgba(edge, 0.4); c.lineWidth = 0.8;
    c.fillRect(-1.3, -0.75, 2.6, 1.5); c.strokeRect(-1.3, -0.75, 2.6, 1.5);
    c.restore();

    // knee lens
    c.fillStyle = near ? edge : rgba(edge, 0.5);
    c.beginPath(); c.arc(kx2, ky2, near ? 0.8 : 0.6, 0, 6.283); c.fill();
    if(near){
      c.fillStyle = COL.ink;
      c.beginPath(); c.arc(kx2, ky2, 0.42, 0, 6.283); c.fill();
    }

    // tarsal claw
    var ta = Math.atan2(fy2 - ky2, fx2 - kx2);
    c.save(); c.translate(fx2, fy2); c.rotate(ta);
    c.fillStyle = near ? edge : rgba(edge, 0.5);
    c.beginPath();
    c.moveTo(-0.75, -0.55); c.lineTo(0.85, 0); c.lineTo(-0.75, 0.55);
    c.closePath(); c.fill();
    c.restore();
  }

  // far bank first, offset in phase so the gait alternates
  // far bank sits behind the body
  for(var i=0;i<LEGS.length;i++) drawLeg(LEGS[i], false, LEGS[i].ph + 3.14);

  /* ---------------- abdomen ---------------- */
  var ag = c.createLinearGradient(axb, BY - 6, axb, BY + 6);
  ag.addColorStop(0, o.hi); ag.addColorStop(0.55, body); ag.addColorStop(1, '#080B05');
  c.fillStyle = ag; c.strokeStyle = edge; c.lineWidth = 1.4;
  c.beginPath();
  c.moveTo(axb + F*5.4, BY - 2.8);
  c.quadraticCurveTo(axb + F*6.4, BY + 0.8, axb + F*4.0, BY + 4.0);
  c.quadraticCurveTo(axb + F*0.4, BY + 5.6, axb - F*4.0, BY + 3.4);
  c.quadraticCurveTo(axb - F*7.2, BY + 1.0, axb - F*6.0, BY - 3.2);
  c.lineTo(axb - F*2.6, BY - 5.4);
  c.lineTo(axb + F*2.2, BY - 5.2);
  c.closePath();
  c.fill(); c.stroke();
  // segment ridges
  // chitin plate seams following the taper
  c.strokeStyle = rgba(COL.ink, 0.45); c.lineWidth = 0.9;
  for(var sg=-1;sg<=1;sg++){
    c.beginPath();
    c.moveTo(axb + F*sg*2.2, BY - 4.9 + Math.abs(sg)*0.7);
    c.quadraticCurveTo(axb + F*sg*3.2, BY, axb + F*sg*2.0, BY + 4.2 - Math.abs(sg)*0.8);
    c.stroke();
  }
  // asymmetric growth pod
  c.fillStyle = '#10150A'; c.strokeStyle = rgba(edge, 0.75); c.lineWidth = 0.9;
  c.beginPath();
  c.ellipse(axb - F*3.4, BY + 1.6, 2.2, 1.5, F*0.5, 0, 6.283);
  c.fill(); c.stroke();
  c.fillStyle = rgba(o.visor, 0.35 + pulse*0.4);
  c.beginPath(); c.ellipse(axb - F*3.4, BY + 1.6, 0.9, 0.6, F*0.5, 0, 6.283); c.fill();
  // dorsal spines
  c.fillStyle = edge;
  for(var sp=0;sp<3;sp++){
    var sx2 = axb + F*(2.4 - sp*2.4), sy2 = BY - 5 - Math.abs(sp - 1)*0.6;
    c.beginPath();
    c.moveTo(sx2 - 1, sy2 + 0.6);
    c.lineTo(sx2 - F*0.6, sy2 - 3.4);
    c.lineTo(sx2 + 1, sy2 + 0.6);
    c.closePath(); c.fill();
  }
  // rim light
  c.strokeStyle = rgba(COL.paper, 0.3); c.lineWidth = 0.9;
  c.beginPath();
  c.moveTo(axb - F*4.4, BY - 4.2);
  c.quadraticCurveTo(axb - F*0.6, BY - 5.6, axb + F*4.2, BY - 3.2);
  c.stroke();

  // reactor orb is set INTO the abdomen, so the near legs occlude it correctly
  drawCore(axb, BY - 0.4, 2.1, o.badge);

  /* ---------------- thruster nozzles + spinnerets ---------------- */
  c.fillStyle = '#0C1007'; c.strokeStyle = edge; c.lineWidth = 1;
  for(var nz=0;nz<2;nz++){
    var nzx = axb - F*(1.4 + nz*2.6);
    c.beginPath();
    c.moveTo(nzx - 1.6, BY + 2.2); c.lineTo(nzx + 1.6, BY + 2.2);
    c.lineTo(nzx + 1.1 - F*0.5, BY + 4.4); c.lineTo(nzx - 1.1 - F*0.5, BY + 4.4);
    c.closePath(); c.fill(); c.stroke();
    c.fillStyle = rgba(o.visor, o.thrust ? 0.95 : 0.3);
    c.fillRect(nzx - 1.1, BY + 3.7, 2.2, 0.8);
    c.fillStyle = '#0C1007';
  }

  /* ---------------- pedicel ---------------- */
  c.fillStyle = '#0A0E06';
  c.fillRect(Math.min(cxb, axb) + 2.6, BY - 1.4, Math.abs(cxb - axb) - 5.2, 2.8);

  /* ---------------- cephalothorax ---------------- */
  var cg = c.createLinearGradient(cxb, BY - 5, cxb, BY + 4);
  cg.addColorStop(0, o.hi); cg.addColorStop(0.5, body); cg.addColorStop(1, '#090C05');
  c.fillStyle = cg; c.strokeStyle = edge; c.lineWidth = 1.4;
  c.beginPath();
  c.moveTo(cxb + F*5.0, BY - 1.0);
  c.lineTo(cxb + F*3.2, BY - 3.9);
  c.lineTo(cxb - F*2.0, BY - 4.4);
  c.lineTo(cxb - F*4.4, BY - 1.4);
  c.lineTo(cxb - F*3.0, BY + 2.8);
  c.lineTo(cxb + F*2.2, BY + 3.6);
  c.lineTo(cxb + F*4.6, BY + 1.2);
  c.closePath();
  c.fill(); c.stroke();
  // carapace ribs
  c.strokeStyle = rgba(COL.ink, 0.4); c.lineWidth = 0.75;
  for(var rb=-1;rb<=1;rb++){
    c.beginPath();
    c.moveTo(cxb + F*0.4, BY - 1.2);
    c.quadraticCurveTo(cxb + F*2.6, BY - 1 + rb*1.6, cxb + F*4.4, BY + 0.4 + rb*2);
    c.stroke();
  }
  c.strokeStyle = rgba(COL.paper, 0.34); c.lineWidth = 0.9;
  c.beginPath();
  c.moveTo(cxb - F*3.4, BY - 2.2);
  c.lineTo(cxb - F*1.8, BY - 3.7);
  c.lineTo(cxb + F*3.0, BY - 3.2);
  c.stroke();

  /* ---------------- thermal intake ---------------- */
  var ecx = cxb + F*2.6, ecy = BY - 1.4;
  c.fillStyle = COL.ink;
  c.beginPath();
  c.moveTo(ecx - F*2.2, ecy - 1.6);
  c.lineTo(ecx + F*1.9, ecy - 1.2);
  c.lineTo(ecx + F*1.6, ecy + 1.9);
  c.lineTo(ecx - F*2.2, ecy + 1.5);
  c.closePath(); c.fill();
  for(var vt=0;vt<3;vt++){
    c.fillStyle = rgba(o.visor, 0.35 + pulse*0.45 - vt*0.08);
    c.fillRect(ecx - F*1.9 - (F > 0 ? 0 : 0.6), ecy - 1.1 + vt*1.05, F*3.4, 0.7);
  }

  /* ---------------- chelicerae ---------------- */
  c.strokeStyle = edge; c.lineWidth = 1.05; c.lineCap = 'round';
  c.beginPath();
  c.moveTo(cxb + F*4.2, BY + 1.6);
  c.quadraticCurveTo(cxb + F*6.2, BY + 2.2, cxb + F*6.6, BY + 4.2);
  c.moveTo(cxb + F*3.2, BY + 2.4);
  c.quadraticCurveTo(cxb + F*5.0, BY + 3.2, cxb + F*5.2, BY + 5.0);
  c.stroke();
  c.fillStyle = rgba(o.visor, 0.5 + pulse*0.3);
  c.beginPath(); c.arc(cxb + F*6.6, BY + 4.2, 0.7, 0, 6.283); c.fill();
  c.beginPath(); c.arc(cxb + F*5.2, BY + 5.0, 0.6, 0, 6.283); c.fill();
  c.lineCap = 'butt';

  /* ---------------- raised skull ---------------- */
  var nkx = cxb - F*0.4, skx = cxb + F*1.2, sky = 18.4;
  // segmented neck
  c.strokeStyle = '#0A0E06'; c.lineWidth = 2.6; c.lineCap = 'round';
  c.beginPath();
  c.moveTo(nkx, BY - 3.6);
  c.quadraticCurveTo(nkx + F*0.2, (BY - 3.6 + sky + 3.4)/2, skx - F*0.6, sky + 3.4);
  c.stroke(); c.lineCap = 'butt';
  c.fillStyle = edge;
  for(var nv=0;nv<2;nv++){
    c.beginPath();
    c.arc(nkx + F*(0.1 + nv*0.3), BY - 4.4 - nv*1.2, 0.8, 0, 6.283);
    c.fill();
  }

  // cranium
  var skg = c.createLinearGradient(skx, sky - 5, skx, sky + 4);
  skg.addColorStop(0, o.hi); skg.addColorStop(1, body);
  c.fillStyle = skg; c.strokeStyle = edge; c.lineWidth = 1.25;
  c.beginPath();
  c.moveTo(skx + F*3.5, sky + 0.6);
  c.quadraticCurveTo(skx + F*4.1, sky - 2.1, skx + F*2.2, sky - 3.6);
  c.quadraticCurveTo(skx - F*0.6, sky - 4.8, skx - F*3.2, sky - 3.2);
  c.quadraticCurveTo(skx - F*4.6, sky - 2, skx - F*3.2, sky - 0.4);
  c.quadraticCurveTo(skx - F*1, sky + 1.4, skx + F*1.6, sky + 1.6);
  c.closePath(); c.fill(); c.stroke();

  // brow ridge
  c.strokeStyle = rgba(COL.ink, 0.5); c.lineWidth = 0.85;
  c.beginPath();
  c.moveTo(skx + F*3.2, sky - 1.2);
  c.quadraticCurveTo(skx, sky - 2.6, skx - F*2.8, sky - 1.8);
  c.stroke();

  // deep-set eye sockets
  for(var so=0;so<2;so++){
    var sox = skx + F*(2.1 - so*2.2), soy = sky - 0.3;
    c.fillStyle = COL.ink;
    c.beginPath(); c.ellipse(sox, soy, 1.35 - so*0.2, 1.05 - so*0.15, F*0.3, 0, 6.283); c.fill();
    c.fillStyle = o.visor;
    c.beginPath(); c.ellipse(sox, soy, 0.9 - so*0.15, 0.68 - so*0.1, F*0.3, 0, 6.283); c.fill();
  }
  c.fillStyle = COL.paper;
  c.beginPath(); c.arc(skx + F*2.3, sky - 0.6, 0.36, 0, 6.283); c.fill();

  // fanged jaw
  c.fillStyle = '#0A0E06'; c.strokeStyle = edge; c.lineWidth = 1;
  c.beginPath();
  c.moveTo(skx + F*3.2, sky + 1.2);
  c.quadraticCurveTo(skx + F*1.4, sky + 3.4, skx - F*1.4, sky + 2.4);
  c.lineTo(skx - F*1.2, sky + 1.4);
  c.closePath(); c.fill(); c.stroke();
  c.fillStyle = edge;
  for(var tk=0;tk<4;tk++){
    var tkx = skx + F*(2.6 - tk*1.1);
    c.beginPath();
    c.moveTo(tkx - 0.4, sky + 1.6);
    c.lineTo(tkx, sky + 3.4 - tk*0.35);
    c.lineTo(tkx + 0.4, sky + 1.6);
    c.closePath(); c.fill();
  }

  // umbilical socket set into the back of the cranium
  var sokx = skx - F*3.4, soky = sky - 0.8;
  c.fillStyle = '#0A0E06'; c.strokeStyle = edge; c.lineWidth = 1;
  c.beginPath(); c.ellipse(sokx, soky, 1.5, 1.2, F*0.2, 0, 6.283); c.fill(); c.stroke();
  c.fillStyle = rgba(o.visor, 0.55 + Math.abs(Math.sin(frame*0.06))*0.35);
  c.beginPath(); c.ellipse(sokx, soky, 0.75, 0.6, F*0.2, 0, 6.283); c.fill();


  /* ---------------- witchfire off the skull ---------------- */
  // the flame leans against travel and flattens under acceleration
  var vx2 = o.vx || 0, vy2 = o.vy || 0;
  // constant backward rake, plus lean against travel
  var leanX = clamp(-F*3.4 - vx2*0.55, -7.5, 7.5);
  var leanY = clamp(vy2*0.30, -1.8, 2.4);
  var crownY = sky - 3.2;

  var hal = c.createRadialGradient(skx - F*0.4, crownY - 2, 0.5, skx - F*0.4, crownY - 2, 8);
  hal.addColorStop(0, rgba(COL.lime, 0.30));
  hal.addColorStop(1, rgba(COL.lime, 0));
  c.fillStyle = hal;
  c.beginPath(); c.arc(skx - F*0.4, crownY - 2, 10, 0, 6.283); c.fill();

  var SEG = 5;
  for(var fl=0;fl<7;fl++){
    var ph2 = fl*1.61;
    var fbx = skx + F*(2.0 - fl*0.7);
    var fby = crownY + Math.abs(fl - 3)*0.4;
    // two incommensurate frequencies keep the flicker from looking looped
    var flick = 0.62 + Math.abs(Math.sin(frame*0.13 + ph2))*0.26
                     + Math.sin(frame*0.077 + ph2*2.1)*0.12;
    var fh = (4.3 + Math.abs(Math.sin(frame*0.09 + ph2))*3.5) * flick;
    fh = Math.max(1.4, fh + leanY*0.5);
    var fw = 1.12 - Math.abs(fl - 3)*0.12;

    // build a curved centreline: displacement accumulates toward the tip
    var pts = [];
    for(var sgi=0;sgi<=SEG;sgi++){
      var u = sgi/SEG;
      var turb = Math.sin(frame*0.16 + ph2 + u*3.1)*0.50*u
               + Math.sin(frame*0.29 + ph2*1.7 + u*5.3)*0.22*u;
      pts.push({
        x: fbx + leanX*Math.pow(u, 1.45) + turb,
        y: fby - fh*u,
        w: fw*(1 - u)*(1 - u*0.35)
      });
    }
    var fg = c.createLinearGradient(fbx, fby, pts[SEG].x, pts[SEG].y);
    fg.addColorStop(0, rgba(COL.paper, 0.55));
    fg.addColorStop(0.35, rgba(COL.lime, 0.52));
    fg.addColorStop(1, rgba(COL.lime, 0));
    c.fillStyle = fg;
    c.beginPath();
    c.moveTo(pts[0].x - pts[0].w, pts[0].y);
    for(var up=1;up<=SEG;up++) c.lineTo(pts[up].x - pts[up].w, pts[up].y);
    for(var dn=SEG;dn>=0;dn--) c.lineTo(pts[dn].x + pts[dn].w, pts[dn].y);
    c.closePath(); c.fill();
  }

  // sockets breathe with the fire, gently
  c.fillStyle = rgba(COL.paper, 0.12 + Math.abs(Math.sin(frame*0.13))*0.14);
  c.beginPath(); c.arc(skx + F*2.1, sky - 0.3, 1.3, 0, 6.283); c.fill();
  c.beginPath(); c.arc(skx - F*0.1, sky - 0.3, 1.05, 0, 6.283); c.fill();

  /* ---------------- near leg bank, in front of the body ---------------- */
  for(var j=0;j<LEGS.length;j++) drawLeg(LEGS[j], true, LEGS[j].ph);

  /* ---------------- bioluminescent veins ---------------- */
  c.strokeStyle = rgba(o.visor, pulse); c.lineWidth = 0.6;
  c.beginPath();
  c.moveTo(axb - F*3.4, BY - 2.6); c.quadraticCurveTo(axb, BY - 4, axb + F*3.4, BY - 2.2);
  c.moveTo(cxb - F*3, BY - 2.4); c.quadraticCurveTo(cxb, BY - 3.4, cxb + F*2.4, BY - 2.8);
  c.stroke();
}


function drawCore(cx, cy, r, col){
  var c = wctx;
  c.globalAlpha = 0.22 + Math.abs(Math.sin(frame*0.06))*0.16;
  c.fillStyle = col;
  c.beginPath(); c.arc(cx, cy, r*1.9, 0, 6.283); c.fill();
  c.globalAlpha = 1;
  c.fillStyle = COL.ink;
  c.beginPath(); c.arc(cx, cy, r*1.3, 0, 6.283); c.fill();
  c.fillStyle = col;
  c.beginPath(); c.arc(cx, cy, r, 0, 6.283); c.fill();
  c.fillStyle = COL.paper;
  c.beginPath(); c.arc(cx - r*0.3, cy - r*0.3, r*0.42, 0, 6.283); c.fill();
}

function drawPlayer(){
  var p = player;
  if(p.inv > 0 && Math.floor(frame/4) % 2 === 0 && p.hitFlash > 0) return;
  var x = p.x - cam.x, y = p.y;

  entShadow(p.x + p.w/2, p.y + p.h, p.w);
  wctx.save(); wctx.translate(x, y);
  var body = p.hitFlash > 0 ? COL.paper : '#242B14';
  var hi   = p.hitFlash > 0 ? COL.paper : '#3A4520';
  var edge = p.hitFlash > 0 ? COL.red : COL.lime;
  var lit  = p.hitFlash > 0 ? COL.red : COL.lime;

  if(p.docked){
    // riding the carrier: bay open, suit slung beneath the hull
    mothership(23, 8, 0.50, frame*0.6, p.cool > 18, true);
    wctx.save(); wctx.translate(23, 19); wctx.scale(0.62, 0.62);
    wctx.translate(-13, -18);
    // abbreviated suit: torso, head, legs tucked
    wctx.fillStyle = body; wctx.strokeStyle = edge; wctx.lineWidth = 2.6;
    wctx.beginPath();
    wctx.moveTo(6, 11); wctx.lineTo(20, 11); wctx.lineTo(21, 17);
    wctx.lineTo(17, 23); wctx.lineTo(9, 23); wctx.lineTo(5, 17);
    wctx.closePath(); wctx.fill(); wctx.stroke();
    wctx.fillStyle = lit;
    wctx.beginPath(); wctx.arc(13, 16, 2.6, 0, 6.283); wctx.fill();
    wctx.fillStyle = body; wctx.strokeStyle = edge; wctx.lineWidth = 2.2;
    wctx.beginPath();
    wctx.moveTo(9.6, 5); wctx.lineTo(11, 2.4); wctx.lineTo(15.4, 2.4);
    wctx.lineTo(17.4, 5.4); wctx.lineTo(16.4, 9.4); wctx.lineTo(10.4, 9.4);
    wctx.closePath(); wctx.fill(); wctx.stroke();
    wctx.fillStyle = lit;
    wctx.fillRect(11, 4.6, 2.2, 1.8); wctx.fillRect(14, 4.6, 2.2, 1.8);
    wctx.fillStyle = edge;
    wctx.beginPath(); wctx.moveTo(12.4, 2.6); wctx.lineTo(14.4, -3.4); wctx.lineTo(15, 2.6);
    wctx.closePath(); wctx.fill();
    // tucked legs
    wctx.strokeStyle = edge; wctx.lineWidth = 3.4; wctx.lineCap = 'round';
    wctx.beginPath();
    wctx.moveTo(11, 23); wctx.lineTo(8, 28); wctx.lineTo(12, 30);
    wctx.moveTo(15, 23); wctx.lineTo(18, 28); wctx.lineTo(14, 30);
    wctx.stroke(); wctx.lineCap = 'butt';
    wctx.restore();
    addLight(p.x + 23, p.y + 14, 74, COL.lime, 0.40);
  } else {
    var step = p.grounded ? Math.sin(p.walk)*5 : 3;
    robotSuit({edge:edge, body:body, hi:hi, badge:lit, visor:lit,
               step:step, face:p.face, thrust:p.thrusting,
               walk:p.walk, grounded:p.grounded, vx:p.vx, vy:p.vy});
    addLight(p.x + 13, p.y + 24, 40, COL.lime, 0.30);
    // witchfire glow off the skull
    addLight(p.x + 13 + p.face*2.4, p.y + 13.5, 54 + Math.sin(frame*0.13)*7,
             COL.lime, 0.36 + Math.abs(Math.sin(frame*0.13))*0.16);
    addLight(p.x + 13, p.y + 14.4, 16, COL.paper, 0.40);
    if(p.thrusting) addLight(p.x + 13, p.y + 40, 64, COL.lime, 0.40);
  }
  wctx.restore();

  var bcx = x + p.w/2, bcy = y + (p.docked ? 14 : 24);
  if(p.spdT > 0 && Math.abs(p.vx) > 1.4){
    for(var tr=1;tr<=3;tr++){
      wctx.globalAlpha = 0.16/tr;
      wctx.strokeStyle = COL.lime; wctx.lineWidth = 2;
      wctx.beginPath();
      wctx.ellipse(bcx - p.face*tr*6, bcy, 9, 7, 0, 0, 6.283);
      wctx.stroke();
      wctx.globalAlpha = 1;
    }
  }

  // discharge flare at the maw
  if(p.cool > (p.docked ? 20 : 2)){
    var amF = armMount(p);
    wctx.save();
    wctx.translate(x + amF.x, y + amF.y);
    wctx.rotate(p.aim);
    wctx.fillStyle = rgba(COL.paper, 0.9);
    wctx.beginPath();
    wctx.moveTo(0, 0);
    wctx.lineTo(15, -6.5); wctx.lineTo(9, 0); wctx.lineTo(15, 6.5);
    wctx.closePath(); wctx.fill();
    wctx.fillStyle = rgba(COL.lime, 0.55);
    wctx.beginPath();
    wctx.moveTo(0, 0);
    wctx.lineTo(23, -9); wctx.lineTo(13, 0); wctx.lineTo(23, 9);
    wctx.closePath(); wctx.fill();
    wctx.restore();
  }

  if(p.arT > 0){
    // plating overlay: a hard-edged shell hugging the carapace
    wctx.strokeStyle = rgba(COL.paper, 0.30 + Math.sin(frame*0.06)*0.12);
    wctx.lineWidth = 2.2;
    wctx.beginPath();
    wctx.ellipse(bcx - p.face*4, bcy + 1, 11, 8.5, 0, 0, 6.283);
    wctx.stroke();
  }
  if(p.shield > 0){
    var sr = 26 + Math.sin(frame*0.08)*2;
    wctx.strokeStyle = rgba(COL.paper, 0.35 + Math.sin(frame*0.08)*0.15);
    wctx.lineWidth = 1.6;
    wctx.beginPath(); wctx.arc(bcx, bcy, sr, 0, 6.283); wctx.stroke();
    wctx.strokeStyle = rgba(COL.lime, 0.25);
    wctx.beginPath(); wctx.arc(bcx, bcy, sr - 3, 0, 6.283); wctx.stroke();
    addLight(p.x + p.w/2, p.y + (p.docked ? 14 : 22), 60, COL.paper, 0.22);
  }
  if(p.cool > (p.docked ? 20 : 3)){
    var reach = p.docked ? 12.5 : 9.8;
    var am2 = armMount(p);
    var mx = p.x + am2.x + Math.cos(p.aim)*reach, my = p.y + am2.y + Math.sin(p.aim)*reach;
    addLight(mx, my, 58, COL.paper, 0.55);
  }
}

/* ======================= PROJECTILES ======================= */
function drawBullets(){
  for(var i=0;i<bullets.length;i++){
    var b = bullets[i], x = b.x - cam.x;
    if(x < -40 || x > cameraSpanW() + 40) continue;
    var col = b.owner === 'p' ? (b.type === 'aid' ? COL.dim : COL.lime) : COL.red;

    if(b.type === 'lance'){
      var lg = wctx.createLinearGradient(x, b.y, x - b.vx*3, b.y - b.vy*3);
      lg.addColorStop(0, rgba(COL.paper, 0.95));
      lg.addColorStop(0.3, rgba(COL.lime, 0.8));
      lg.addColorStop(1, rgba(COL.lime, 0));
      wctx.strokeStyle = lg; wctx.lineWidth = 4; wctx.lineCap = 'round';
      wctx.beginPath(); wctx.moveTo(x, b.y); wctx.lineTo(x - b.vx*3, b.y - b.vy*3); wctx.stroke();
      wctx.strokeStyle = rgba(COL.paper, 0.9); wctx.lineWidth = 1.2;
      wctx.beginPath(); wctx.moveTo(x, b.y); wctx.lineTo(x - b.vx*1.6, b.y - b.vy*1.6); wctx.stroke();
      wctx.lineCap = 'butt';
      addLight(b.x, b.y, 52, COL.lime, 0.45);
    } else if(b.type === 'heavy'){
      wctx.fillStyle = rgba(COL.lime, 0.28);
      wctx.beginPath(); wctx.arc(x, b.y, 13, 0, 6.283); wctx.fill();
      wctx.fillStyle = COL.lime;
      wctx.beginPath(); wctx.arc(x, b.y, 7, 0, 6.283); wctx.fill();
      wctx.fillStyle = COL.paper;
      wctx.beginPath(); wctx.arc(x - b.vx*0.12, b.y - b.vy*0.12, 3.4, 0, 6.283); wctx.fill();
      wctx.strokeStyle = rgba(COL.lime, 0.5); wctx.lineWidth = 2;
      wctx.beginPath(); wctx.moveTo(x, b.y); wctx.lineTo(x - b.vx*2.4, b.y - b.vy*2.4); wctx.stroke();
      addLight(b.x, b.y, 76, COL.lime, 0.55);
    } else if(b.type === 'shell'){
      wctx.fillStyle = rgba(COL.warn, 0.3);
      wctx.beginPath(); wctx.arc(x, b.y, 9, 0, 6.283); wctx.fill();
      wctx.save(); wctx.translate(x, b.y); wctx.rotate(Math.atan2(b.vy, b.vx));
      wctx.fillStyle = COL.red;
      wctx.beginPath(); wctx.ellipse(0, 0, 5.5, 3.2, 0, 0, 6.283); wctx.fill();
      wctx.fillStyle = COL.warn; wctx.fillRect(-5.5, -1, 3, 2);
      wctx.restore();
      addLight(b.x, b.y, 40, COL.warn, 0.4);
    } else if(b.type === 'burn'){
      wctx.fillStyle = rgba(COL.warn, 0.30);
      wctx.beginPath(); wctx.arc(x, b.y, 9, 0, 6.283); wctx.fill();
      wctx.fillStyle = COL.warn;
      wctx.beginPath(); wctx.arc(x, b.y, 4.5, 0, 6.283); wctx.fill();
      wctx.fillStyle = COL.paper;
      wctx.beginPath(); wctx.arc(x, b.y, 1.8, 0, 6.283); wctx.fill();
      addLight(b.x, b.y, 44, COL.warn, 0.45);
    } else if(b.owner === 'p'){
      wctx.strokeStyle = rgba(col, 0.45); wctx.lineWidth = 3;
      wctx.beginPath(); wctx.moveTo(x, b.y); wctx.lineTo(x - b.vx*1.4, b.y - b.vy*1.4); wctx.stroke();
      wctx.fillStyle = COL.paper;
      wctx.fillRect(x - 3, b.y - 1.4, 7, 2.8);
      addLight(b.x, b.y, 28, col, 0.30);
    } else {
      wctx.fillStyle = rgba(COL.red, 0.28);
      wctx.beginPath(); wctx.arc(x, b.y, 8, 0, 6.283); wctx.fill();
      wctx.strokeStyle = rgba(COL.red, 0.5); wctx.lineWidth = 2.4;
      wctx.beginPath(); wctx.moveTo(x, b.y); wctx.lineTo(x - b.vx*1.6, b.y - b.vy*1.6); wctx.stroke();
      wctx.fillStyle = COL.red;
      wctx.beginPath(); wctx.arc(x, b.y, 3.6, 0, 6.283); wctx.fill();
      wctx.fillStyle = COL.warn;
      wctx.beginPath(); wctx.arc(x, b.y, 1.7, 0, 6.283); wctx.fill();
      addLight(b.x, b.y, 30, COL.red, 0.30);
    }
  }
}

function drawParts(){
  for(var i=0;i<parts.length;i++){
    var p = parts[i], x = p.x - cam.x;
    if(x < -40 || x > cameraSpanW() + 40) continue;
    if(lowFx && p.kind === 'smoke' && ((i + frame) & 1)) continue;
    var t4 = Math.max(0, p.life / p.max);

    if(p.kind === 'smoke'){
      wctx.globalAlpha = 0.34*t4;
      wctx.drawImage(lightSprite(p.col), x - p.r, p.y - p.r, p.r*2, p.r*2);
      wctx.globalAlpha = 1;
    } else if(p.kind === 'ring'){
      wctx.strokeStyle = rgba(p.col, 0.7*t4);
      wctx.lineWidth = 1 + 3*t4;
      wctx.beginPath(); wctx.arc(x, p.y, p.r, 0, 6.283); wctx.stroke();
    } else if(p.kind === 'flash'){
      wctx.globalAlpha = 0.85*t4;
      wctx.drawImage(lightSprite(p.col), x - p.r, p.y - p.r, p.r*2, p.r*2);
      wctx.globalAlpha = 0.9*t4;
      wctx.drawImage(lightSprite(COL.paper), x - p.r*0.5, p.y - p.r*0.5, p.r, p.r);
      wctx.globalAlpha = 1;
      addLight(p.x, p.y, p.r*4.5, p.col, t4);
    } else if(p.kind === 'debris'){
      wctx.save(); wctx.translate(x, p.y); wctx.rotate(p.rot);
      wctx.fillStyle = p.col;
      wctx.fillRect(-p.r, -p.r*0.7, p.r*2, p.r*1.4);
      wctx.strokeStyle = rgba(COL.lime, 0.5*t4); wctx.lineWidth = 0.8;
      wctx.strokeRect(-p.r, -p.r*0.7, p.r*2, p.r*1.4);
      wctx.restore();
    } else {
      // spark with motion streak
      wctx.strokeStyle = rgba(p.col, 0.9*t4);
      wctx.lineWidth = p.r;
      wctx.lineCap = 'round';
      wctx.beginPath();
      wctx.moveTo(x, p.y);
      wctx.lineTo(x - (p.x - p.px)*1.6, p.y - (p.y - p.py)*1.6);
      wctx.stroke();
      wctx.lineCap = 'butt';
      if(p.r > 2.6 && t4 > 0.35) addLight(p.x, p.y, 18, p.col, 0.28*t4);
    }
  }
}

/* ======================= ATMOSPHERE ======================= */
function drawWeather(){
  var spanW = cameraSpanW();
  var weatherStep = lowFx ? 2 : 1;
  for(var i=0;i<motes.length;i+=weatherStep){
    var m = motes[i];
    var mx = (m.x - cam.x*m.z*0.5 + frame*0.16*m.z) % (spanW + 80);
    if(mx < -40) mx += spanW + 80;
    var my = m.y + Math.sin(frame*0.01 + m.ph)*14;
    wctx.globalAlpha = 0.10 + 0.28*Math.abs(Math.sin(frame*0.02 + m.ph));
    wctx.fillStyle = m.z > 0.9 ? COL.lime : COL.dim;
    wctx.fillRect(mx - 40, my, m.r, m.r);
  }
  wctx.globalAlpha = 1;
}

function drawForeground(){
  var spanW = cameraSpanW();
  // near silhouette layer, scrolls faster than the ground
  var par = 1.45, off = cam.x*par;
  var spacing = 320;
  var first = Math.floor(off/spacing) - 1;
  for(var i=first;i<first + Math.ceil(spanW/spacing) + 3;i++){
    var fx = i*spacing - off;
    var kind = hash(i*4.7);
    wctx.fillStyle = '#080A06';
    if(kind < 0.34){
      // pipe cluster
      wctx.fillRect(fx, 430, 26, VH - 430);
      wctx.fillRect(fx + 34, 458, 18, VH - 458);
      wctx.fillRect(fx - 10, 424, 76, 10);
      wctx.fillStyle = 'rgba(204,254,6,0.10)';
      wctx.fillRect(fx, 424, 76, 2);
    } else if(kind < 0.66){
      // rubble mound
      wctx.beginPath();
      wctx.moveTo(fx - 60, VH); wctx.lineTo(fx - 20, 470);
      wctx.lineTo(fx + 6, 486); wctx.lineTo(fx + 40, 462);
      wctx.lineTo(fx + 90, VH);
      wctx.closePath(); wctx.fill();
      wctx.strokeStyle = 'rgba(204,254,6,0.16)'; wctx.lineWidth = 1.4; wctx.stroke();
    } else {
      // mast + cable sag
      wctx.fillRect(fx, 366, 9, VH - 366);
      wctx.fillStyle = 'rgba(204,254,6,0.14)'; wctx.fillRect(fx, 366, 2, VH - 366);
      wctx.fillStyle = '#080A06';
      wctx.strokeStyle = '#05060A'; wctx.lineWidth = 2.4;
      wctx.beginPath();
      wctx.moveTo(fx, 380);
      wctx.quadraticCurveTo(fx + spacing*0.5, 430, fx + spacing, 380);
      wctx.stroke();
      var blink = Math.sin(frame*0.06 + i) > 0.7;
      if(blink){
        wctx.fillStyle = COL.red;
        wctx.fillRect(fx + 2, 360, 4, 4);
        addLight(cam.x + fx + 4, 362, 26, COL.red, 0.35);
      }
    }
  }
  // depth-of-field wash at the very bottom
  var fg = wctx.createLinearGradient(0, VH - 60, 0, VH);
  fg.addColorStop(0, 'rgba(5,6,10,0)');
  fg.addColorStop(1, 'rgba(5,6,10,0.55)');
  wctx.fillStyle = fg; wctx.fillRect(0, VH - 60, spanW, 60);
}

/* ======================= LIGHTING COMPOSITE ======================= */
function compositeLighting(){
  var sxr = LW/VW, syr = LH/VH;

  // shadow / ambient darkness, carved by lights
  dctx.globalCompositeOperation = 'source-over';
  dctx.clearRect(0, 0, BW, BH);
  var amb = dctx.createLinearGradient(0, LPAD, 0, LPAD + LH);
  amb.addColorStop(0, 'rgba(3,5,9,0.55)');
  amb.addColorStop(0.55, 'rgba(3,5,7,0.30)');
  amb.addColorStop(1, 'rgba(2,3,2,0.48)');
  dctx.fillStyle = amb; dctx.fillRect(0, 0, BW, BH);
  dctx.globalCompositeOperation = 'destination-out';

  gctx.clearRect(0, 0, BW, BH);
  gctx.globalCompositeOperation = 'lighter';

  var white = lightSprite(COL.paper);
  var lightCount = lowFx ? Math.min(lights.length, 26) : lights.length;
  for(var i=0;i<lightCount;i++){
    var L = lights[i];
    var x = (L.x - cam.x)*ZOOM*sxr + LPAD, y = (L.y - cam.y)*ZOOM*syr + LPAD;
    var r = Math.max(2, L.r*ZOOM*sxr);
    if(x < -r || x > BW + r) continue;
    if(L.a > 0.14){
      dctx.globalAlpha = clamp(0.62*L.a, 0, 1);
      dctx.drawImage(white, x - r, y - r, r*2, r*2);
    }
    gctx.globalAlpha = clamp(0.30*L.a, 0, 1);
    gctx.drawImage(lightSprite(L.col), x - r, y - r, r*2, r*2);
  }
  dctx.globalAlpha = 1; gctx.globalAlpha = 1;
  dctx.globalCompositeOperation = 'source-over';
  gctx.globalCompositeOperation = 'source-over';

  // the shadow pass is the pricier of the two upscales; bloom matters more, so
  // reduced-quality mode keeps the glow and leans on the static vignette instead
  if(!lowFx) wctx.drawImage(darkBuf, LPAD, LPAD, LW, LH, 0, 0, VW, VH);
  wctx.globalCompositeOperation = 'lighter';
  wctx.drawImage(glowBuf, LPAD, LPAD, LW, LH, 0, 0, VW, VH);
  wctx.globalCompositeOperation = 'source-over';
}

/* ======================= POST ======================= */
function post(){
  var c = mainCtx;
  c.drawImage(vigBuf, 0, 0);

  // low-integrity pulse
  if(state === 'play' && player.hp < 35){
    var a = 0.10 + Math.abs(Math.sin(frame*0.09))*0.15;
    var rg2 = c.createRadialGradient(VW/2, VH/2, VH*0.28, VW/2, VH/2, VH*0.95);
    rg2.addColorStop(0, 'rgba(224,58,31,0)');
    rg2.addColorStop(1, 'rgba(224,58,31,' + a + ')');
    c.fillStyle = rg2; c.fillRect(0, 0, VW, VH);
  }

  // grain
  if(!lowFx){
  c.globalAlpha = 0.045;
  var ox = -(Math.random()*256 | 0), oy = -(Math.random()*256 | 0);
  for(var gx=ox; gx<VW; gx+=256)
    for(var gy=oy; gy<VH; gy+=256)
      c.drawImage(grainBuf, gx, gy);
  c.globalAlpha = 1;
  }

  // bloom-flash
  if(flash > 0){
    c.fillStyle = 'rgba(242,242,234,' + (flash/44) + ')';
    c.fillRect(0, 0, VW, VH);
  }
}

/* ======================= FRAME ======================= */
function draw(){
  lights.length = 0;
  ctx = wctx;

  if(state === 'title'){
    drawTitle();
    ctx = mainCtx;
    mainCtx.clearRect(0, 0, VW, VH);
    mainCtx.drawImage(worldBuf, 0, 0);
    post();
    return;
  }

  wctx.save();
  wctx.scale(ZOOM, ZOOM);
  wctx.translate(0, -cam.y);

  drawSky();
  drawParallax();
  drawTerrain();
  drawBoxes();
  drawDrops();
  drawFoes();
  drawBossMech();
  drawPartner();
  drawPlayer();
  drawBullets();
  drawParts();
  drawWeather();
  drawForeground();

  wctx.restore();
  compositeLighting();

  ctx = mainCtx;
  mainCtx.fillStyle = COL.ink;
  mainCtx.fillRect(0, 0, VW, VH);

  var sx = 0, sy = 0;
  if(shake > 0.4){ sx = rr(-shake, shake); sy = rr(-shake, shake); }
  mainCtx.drawImage(worldBuf, -6 + sx, -6 + sy, VW + 12, VH + 12);

  // impact ghosting stands in for lens shock
  if(shake > 5 && !lowFx){
    mainCtx.globalCompositeOperation = 'lighter';
    mainCtx.globalAlpha = clamp(shake/40, 0, 0.22);
    mainCtx.drawImage(worldBuf, -6 + sx - 3, -6 + sy, VW + 12, VH + 12);
    mainCtx.drawImage(worldBuf, -6 + sx + 3, -6 + sy, VW + 12, VH + 12);
    mainCtx.globalAlpha = 1;
    mainCtx.globalCompositeOperation = 'source-over';
  }

  post();
  drawHUD();

  if(paused) overlay('PAUSED', 'press P or START to resume', '');
  if(state === 'stagec'){
    var sc = clamp(stateTimer/24, 0, 1);
    mainCtx.fillStyle = 'rgba(6,8,4,' + (0.86*sc) + ')';
    mainCtx.fillRect(0, 0, VW, VH);
    mainCtx.textAlign = 'center';
    mainCtx.globalAlpha = sc;
    mainCtx.fillStyle = COL.lime;
    mainCtx.font = '600 44px Newsreader, Georgia, serif';
    mainCtx.fillText('SECTOR CLEAR', VW/2, VH/2 - 16);
    mainCtx.fillStyle = COL.paper;
    mainCtx.font = '13px "IBM Plex Mono", monospace';
    mainCtx.fillText('IMPACT LOGGED: ' + score, VW/2, VH/2 + 16);
    mainCtx.fillStyle = COL.warn;
    mainCtx.font = '600 12px "IBM Plex Mono", monospace';
    var unlockedNow = weaponUnlock.timer > 0 && weaponUnlock.name;
    if(unlockedNow){
      mainCtx.fillText('WEAPON UNLOCKED // ' + weaponUnlock.name, VW/2, VH/2 + 42);
      mainCtx.fillStyle = COL.mute;
    }
    mainCtx.fillText('ADVANCING TO ' + STAGES[clamp(stage, 0, STAGE_COUNT - 1)].name,
                     VW/2, VH/2 + (unlockedNow ? 64 : 44));
    mainCtx.fillStyle = rgba(COL.lime, 0.7);
    mainCtx.fillRect(VW/2 - 110, VH/2 + (unlockedNow ? 80 : 60),
                     220*clamp(stateTimer/190, 0, 1), 3);
    mainCtx.globalAlpha = 1;
    mainCtx.textAlign = 'left';
  }
  if(state === 'over') overlay('SUIT DESTROYED', 'IMPACT LOGGED: ' + score, 'press any key or gamepad button to redeploy');
  if(state === 'win')  overlay('ALL SECTORS CLEAR', 'IMPACT LOGGED: ' + score, 'press any key or gamepad button to run it again');
}

/* ======================= HUD ======================= */
var hudGhost = {hp:1, solar:1};

function frameBox(x, y, w, h, col, fillA){
  var c = mainCtx;
  col = col || COL.dim;
  c.fillStyle = 'rgba(6,8,4,' + (fillA === undefined ? 0.62 : fillA) + ')';
  c.fillRect(x, y, w, h);
  c.strokeStyle = rgba(col, 0.35); c.lineWidth = 1;
  c.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  c.strokeStyle = rgba(col, 0.95); c.lineWidth = 1.6;
  var L = 8;
  c.beginPath();
  c.moveTo(x + 1, y + L); c.lineTo(x + 1, y + 1); c.lineTo(x + L, y + 1);
  c.moveTo(x + w - L, y + 1); c.lineTo(x + w - 1, y + 1); c.lineTo(x + w - 1, y + L);
  c.moveTo(x + 1, y + h - L); c.lineTo(x + 1, y + h - 1); c.lineTo(x + L, y + h - 1);
  c.moveTo(x + w - L, y + h - 1); c.lineTo(x + w - 1, y + h - 1); c.lineTo(x + w - 1, y + h - L);
  c.stroke();
}

function gauge(x, y, w, h, pct, ghost, fill, label, val, warnLow){
  var c = mainCtx;
  frameBox(x, y, w, h);
  // ghost (damage lag)
  if(ghost > pct){
    c.fillStyle = rgba(COL.red, 0.55);
    c.fillRect(x + 3, y + 3, (w - 6)*ghost, h - 6);
  }
  var grad = c.createLinearGradient(x, y, x, y + h);
  grad.addColorStop(0, rgba(fill, 0.95));
  grad.addColorStop(0.5, rgba(fill, 0.65));
  grad.addColorStop(1, rgba(fill, 0.95));
  c.fillStyle = grad;
  c.fillRect(x + 3, y + 3, Math.max(0, (w - 6)*pct), h - 6);
  // leading edge
  if(pct > 0.01){
    c.fillStyle = COL.paper;
    c.fillRect(x + 3 + (w - 6)*pct - 1.5, y + 3, 1.5, h - 6);
  }
  // segment ticks
  c.fillStyle = 'rgba(6,8,4,0.75)';
  for(var i=1;i<20;i++) c.fillRect(x + 3 + ((w-6)/20)*i, y + 3, 1, h - 6);
  // labels
  c.font = '9px "IBM Plex Mono", monospace';
  c.fillStyle = (warnLow && pct < 0.3) ? COL.red : COL.mute;
  c.fillText(label, x, y - 5);
  c.textAlign = 'right';
  c.fillStyle = COL.paper;
  c.fillText(val, x + w, y - 5);
  c.textAlign = 'left';
}

function drawHUD(){
  var c = mainCtx;
  if(state === 'title') return;
  var hpPct = clamp(player.hp / player.maxhp, 0, 1);
  var soPct = clamp(player.solar / player.maxsolar, 0, 1);
  hudGhost.hp += (hpPct - hudGhost.hp) * (hudGhost.hp > hpPct ? 0.045 : 0.5);
  hudGhost.solar = soPct;

  gauge(22, 30, 236, 15, hpPct, hudGhost.hp,
        player.hp < 30 ? COL.red : COL.lime, 'INTEGRITY',
        Math.max(0, Math.round(hpPct*100)) + '%', true);
  gauge(22, 66, 236, 11, soPct, soPct, player.docked ? COL.warn : COL.dim, 'SOLAR',
        Math.ceil(player.solar) + '/' + player.maxsolar, true);

  // solar drain warning
  if(player.solar < 25){
    c.fillStyle = rgba(COL.warn, 0.4 + Math.abs(Math.sin(frame*0.16))*0.5);
    c.font = '600 9px "IBM Plex Mono", monospace';
    c.fillText('LOW CHARGE', 200, 90);
  }

  // weapon rack
  var wx2 = 22, wy = 96;
  for(var i=0;i<WEAPONS.length && !player.docked;i++){
    var unlocked = i < player.weaponsUnlocked;
    var on = unlocked && !player.docked && player.weapon === i;
    var bxp = wx2 + i*78;
    frameBox(bxp, wy, 74, 22, on ? COL.lime : (unlocked ? COL.dim : COL.grey),
             on ? 0.35 : (unlocked ? 0.6 : 0.38));
    if(on){
      c.fillStyle = rgba(COL.lime, 0.30);
      c.fillRect(bxp + 2, wy + 2, 70, 18);
      // cooldown sweep
      var cdp = clamp(player.cool / WEAPONS[i].cd, 0, 1);
      if(cdp > 0){
        c.fillStyle = rgba(COL.ink, 0.55);
        c.fillRect(bxp + 2, wy + 2, 70*cdp, 18);
      }
    }
    c.fillStyle = on ? COL.paper : (unlocked ? COL.mute : COL.grey);
    c.font = '600 9px "IBM Plex Mono", monospace';
    c.fillText((i+1) + '  ' + (unlocked ? WEAPONS[i].name : 'LOCKED'), bxp + 8, wy + 14);
    // cost pips
    var pips = unlocked ? Math.max(1, Math.ceil(WEAPONS[i].cost / 8)) : 0;
    for(var pp=0;pp<pips;pp++){
      c.fillStyle = rgba(on ? COL.lime : COL.dim, 0.8);
      c.fillRect(bxp + 60 + pp*3.5, wy + 15, 2, 4);
    }
  }

  // dock status
  if(player.docked){
    frameBox(22, wy, 230, 22, COL.warn, 0.94);
    c.fillStyle = rgba(COL.warn, 0.22); c.fillRect(24, wy + 2, 226, 18);
    c.fillStyle = COL.warn; c.font = '600 9px "IBM Plex Mono", monospace';
    c.fillText('ABOARD // HEAVY CANNON', 32, wy + 14);
    c.fillStyle = rgba(COL.warn, 0.5 + Math.abs(Math.sin(frame*0.2))*0.5);
    c.fillRect(236, wy + 7, 8, 8);
  } else if(player.dockCd > 0){
    c.fillStyle = COL.mute; c.font = '10px "IBM Plex Mono", monospace';
    c.fillText('IMPACT-1 RELINK ' + (player.dockCd/60).toFixed(1) + 's', 22, wy + 36);
  } else {
    c.fillStyle = rgba(COL.mute, 0.95); c.font = '10px "IBM Plex Mono", monospace';
    c.fillText('[SPACE] BOARD IMPACT-1', 22, wy + 36);
  }

  // active buffs
  var bx3 = 22, by3 = 136;
  function buffChip(label, t, max, col){
    var w3 = 62;
    c.fillStyle = 'rgba(6,8,4,0.8)'; c.fillRect(bx3, by3, w3, 15);
    c.fillStyle = rgba(col, 0.3);
    c.fillRect(bx3 + 1, by3 + 1, (w3 - 2) * clamp(t/max, 0, 1), 13);
    c.strokeStyle = rgba(col, 0.8); c.lineWidth = 1;
    c.strokeRect(bx3 + 0.5, by3 + 0.5, w3 - 1, 14);
    c.fillStyle = COL.paper; c.font = '600 8px "IBM Plex Mono", monospace';
    c.fillText(label, bx3 + 5, by3 + 10.5);
    bx3 += w3 + 6;
  }
  if(player.ocT > 0)  buffChip('OVERCLOCK', player.ocT, 600, COL.warn);
  if(player.spT > 0)  buffChip('SPREAD', player.spT, 600, COL.lime);
  if(player.arT > 0)  buffChip('ARMOR', player.arT, 780, COL.paper);
  if(player.spdT > 0) buffChip('SPEED', player.spdT, 660, COL.lime);
  if(player.shield > 0){
    c.fillStyle = 'rgba(6,8,4,0.8)'; c.fillRect(bx3, by3, 46, 15);
    c.strokeStyle = rgba(COL.paper, 0.8); c.lineWidth = 1;
    c.strokeRect(bx3 + 0.5, by3 + 0.5, 45, 14);
    c.fillStyle = COL.paper; c.font = '600 8px "IBM Plex Mono", monospace';
    c.fillText('SHIELD', bx3 + 5, by3 + 10.5);
    for(var sh=0;sh<player.shield;sh++){
      c.fillStyle = COL.paper;
      c.fillRect(bx3 + 34 + sh*3.5, by3 + 4, 2.4, 7);
    }
  }

  // combo
  if(player.combo >= 3){
    var mult2 = clamp(1 + Math.floor(player.combo/3), 1, 5);
    c.textAlign = 'center';
    c.globalAlpha = clamp(player.comboT/60, 0, 1);
    c.fillStyle = mult2 >= 4 ? COL.warn : COL.lime;
    c.font = '600 22px "IBM Plex Mono", monospace';
    c.fillText('x' + mult2, VW/2, 60);
    c.fillStyle = COL.mute; c.font = '10px "IBM Plex Mono", monospace';
    c.fillText(player.combo + ' CHAIN', VW/2, 74);
    c.globalAlpha = 1;
    c.textAlign = 'left';
  }

  // sector label
  c.textAlign = 'center';
  c.fillStyle = COL.mute; c.font = '600 10px "IBM Plex Mono", monospace';
  c.fillText(SG().name, VW/2, 28);
  c.textAlign = 'left';

  // score block
  c.textAlign = 'right';
  c.fillStyle = COL.mute; c.font = '10px "IBM Plex Mono", monospace';
  c.fillText('IMPACT LOGGED', VW - 22, 28);
  c.fillStyle = COL.lime; c.font = '600 26px "IBM Plex Mono", monospace';
  c.fillText(String(score).padStart(6, '0'), VW - 22, 54);
  c.strokeStyle = rgba(COL.lime, 0.5); c.lineWidth = 1;
  c.beginPath(); c.moveTo(VW - 150, 62); c.lineTo(VW - 22, 62); c.stroke();

  // sector telemetry
  var pct = clamp(player.x / BOSS_GATE, 0, 1);
  c.fillStyle = COL.mute; c.font = '10px "IBM Plex Mono", monospace';
  c.fillText(boss ? 'CONTACT // WEAPONS FREE' : 'SECTOR SWEEP ' + Math.floor(pct*100) + '%', VW - 22, 78);
  if(!audioMuted && !audioIsAudible()){
    c.fillStyle = COL.warn; c.font = '600 9px "IBM Plex Mono", monospace';
    c.fillText('AUDIO BLOCKED // CLICK OR PRESS A KEY', VW - 22, 103);
  }
  c.textAlign = 'left';
  // progress rail
  c.fillStyle = 'rgba(6,8,4,0.7)';
  c.fillRect(VW - 152, 84, 130, 4);
  c.fillStyle = rgba(COL.lime, 0.75);
  c.fillRect(VW - 152, 84, 130*pct, 4);
  c.fillStyle = COL.warn;
  c.fillRect(VW - 24, 82, 3, 8);

  // enemy off-screen markers
  for(var e=0;e<foes.length;e++){
    var f = foes[e], fx2 = f.x - cam.x;
    if(fx2 > VW - 30 && fx2 < VW + 700){
      var alpha = clamp(1 - (fx2 - VW)/700, 0.15, 0.8);
      c.fillStyle = rgba(COL.red, alpha);
      c.beginPath();
      c.moveTo(VW - 10, clamp(f.y, 120, VH - 90));
      c.lineTo(VW - 20, clamp(f.y, 120, VH - 90) - 5);
      c.lineTo(VW - 20, clamp(f.y, 120, VH - 90) + 5);
      c.closePath(); c.fill();
    }
  }

  // boss bar
  if(boss){
    var bw = 540, bx2 = (VW - bw)/2, by2 = VH - 58;
    var bp = clamp(boss.hp/boss.maxhp, 0, 1);
    frameBox(bx2, by2, bw, 20, COL.warn, 0.7);
    var bgr2 = c.createLinearGradient(bx2, by2, bx2, by2 + 20);
    bgr2.addColorStop(0, rgba(COL.warn, 0.95));
    bgr2.addColorStop(0.5, rgba(COL.red, 0.85));
    bgr2.addColorStop(1, rgba(COL.warn, 0.95));
    c.fillStyle = bgr2;
    c.fillRect(bx2 + 3, by2 + 3, (bw - 6)*bp, 14);
    c.fillStyle = 'rgba(6,8,4,0.7)';
    for(var s2=1;s2<3;s2++) c.fillRect(bx2 + 3 + (bw-6)*(s2/3), by2 + 3, 2, 14);
    c.fillStyle = COL.paper; c.font = '600 10px "IBM Plex Mono", monospace';
    c.fillText(SG().boss, bx2, by2 - 6);
    c.textAlign = 'right';
    c.fillStyle = COL.warn;
    c.fillText('PHASE ' + boss.phase + ' // ' + Math.ceil(boss.hp) + ' HP', bx2 + bw, by2 - 6);
    c.textAlign = 'left';
  }

  // boss intro slam
  if(intro > 0){
    var k = intro;
    var lb = clamp((170 - k)/12, 0, 1) * clamp(k/20, 0, 1);
    c.fillStyle = 'rgba(6,8,4,0.92)';
    c.fillRect(0, 0, VW, 92*lb);
    c.fillRect(0, VH - 92*lb, VW, 92*lb);
    // hazard stripes
    c.save();
    c.beginPath(); c.rect(0, 92*lb - 8, VW, 8); c.clip();
    for(var hs=0;hs<70;hs++){
      c.fillStyle = hs % 2 ? rgba(COL.warn, 0.55) : 'rgba(6,8,4,0.6)';
      c.save(); c.translate(hs*16 - (frame*0.6 % 32), 92*lb - 8); c.rotate(0.5);
      c.fillRect(0, -10, 9, 30); c.restore();
    }
    c.restore();
    if(k < 150){
      var slide = clamp((150 - k)/14, 0, 1);
      c.textAlign = 'center';
      c.globalAlpha = clamp(k/28, 0, 1);
      c.fillStyle = COL.warn; c.font = '10px "IBM Plex Mono", monospace';
      c.fillText('SECTOR BOSS', VW/2, VH/2 - 44);
      c.fillStyle = COL.paper;
      c.font = '600 52px Newsreader, Georgia, serif';
      c.fillText(SG().boss, VW/2 - (1 - slide)*40, VH/2);
      c.fillStyle = COL.lime; c.font = '10px "IBM Plex Mono", monospace';
      c.fillText('SALVAGE RIG // HOSTILE // THREE PHASES', VW/2, VH/2 + 26);
      c.globalAlpha = 1;
      c.textAlign = 'left';
    }
  }

}

function overlay(title, line1, line2){
  var c = mainCtx;
  c.fillStyle = 'rgba(6,8,4,0.86)';
  c.fillRect(0, 0, VW, VH);
  c.strokeStyle = rgba(COL.lime, 0.25); c.lineWidth = 1;
  for(var i=0;i<VH;i+=4){ c.beginPath(); c.moveTo(0, i); c.lineTo(VW, i); c.stroke(); }
  c.textAlign = 'center';
  c.fillStyle = rgba(COL.lime, 0.25);
  c.font = '600 46px Newsreader, Georgia, serif';
  c.fillText(title, VW/2 + 3, VH/2 - 14);
  c.fillStyle = COL.lime;
  c.fillText(title, VW/2, VH/2 - 16);
  c.fillStyle = COL.paper;
  c.font = '13px "IBM Plex Mono", monospace';
  c.fillText(line1, VW/2, VH/2 + 18);
  c.fillStyle = COL.dim;
  c.font = '11px "IBM Plex Mono", monospace';
  c.fillText(line2, VW/2, VH/2 + 48);
  c.textAlign = 'left';
}

/* ======================= TITLE ======================= */
function rrect(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

function keycap(x, y, label, a){
  var c = wctx;
  c.font = '600 9px "IBM Plex Mono", monospace';
  var w = Math.max(20, c.measureText(label).width + 12);
  c.globalAlpha = a;
  c.fillStyle = 'rgba(8,11,6,0.9)';
  rrect(c, x, y, w, 17, 3); c.fill();
  c.strokeStyle = rgba(COL.lime, 0.5); c.lineWidth = 1;
  rrect(c, x + 0.5, y + 0.5, w - 1, 16, 3); c.stroke();
  c.fillStyle = rgba(COL.lime, 0.2);
  rrect(c, x + 2, y + 2, w - 4, 3.5, 2); c.fill();
  c.fillStyle = COL.paper;
  c.textAlign = 'center';
  c.fillText(label, x + w/2, y + 12);
  c.textAlign = 'left';
  c.globalAlpha = 1;
  return w;
}

function drawTitle(){
  var c = wctx;
  var t = frame * 0.02;
  var T = stateTimer;
  function ease(a, b){ return 1 - Math.pow(1 - clamp((T - a)/b, 0, 1), 3); }
  var GY = 442;

  /* ---------------- backdrop ---------------- */
  var sky = c.createLinearGradient(0, cam.y - 70, 0, cam.y + VIEW_H + 70);
  sky.addColorStop(0.00, '#04060A');
  sky.addColorStop(0.35, '#080D0C');
  sky.addColorStop(0.70, '#121809');
  sky.addColorStop(1.00, '#0A0C07');
  // The title is rendered without the gameplay camera transform, so its
  // backdrop must cover the canvas directly rather than starting at cam.y.
  c.fillStyle = sky; c.fillRect(-30, -2, VW + 60, VH + 4);

  for(var i=0;i<110;i++){
    var sx = hash(i)*VW, sy = hash(i+61)*620 - 170;
    var tw = 0.25 + 0.75*Math.abs(Math.sin(frame*0.014 + i*1.6));
    c.globalAlpha = tw*0.7;
    c.fillStyle = (i % 12 === 0) ? COL.lime : '#D2E2B0';
    c.fillRect(sx, sy, i % 17 === 0 ? 2 : 1.2, i % 17 === 0 ? 2 : 1.2);
  }
  c.globalAlpha = 1;

  /* ---- the sister world, low on the horizon ---- */
  var MX = 480, MY = 286, MR = 226;
  function ringPass(front){
    c.save();
    c.translate(MX, MY); c.rotate(-0.34);
    for(var rp=0;rp<3;rp++){
      // the far arc is dimmed as if seen through the planet's glow
      c.strokeStyle = rgba(COL.lime, (front ? 0.46 : 0.20) - rp*0.08);
      c.lineWidth = 5 - rp*1.2;
      c.beginPath();
      c.ellipse(0, 0, MR*1.32 + rp*13, MR*0.30 + rp*4, 0,
                front ? 0 : Math.PI, front ? Math.PI : Math.PI*2);
      c.stroke();
    }
    c.restore();
  }

  var halo = c.createRadialGradient(MX, MY, MR*0.75, MX, MY, MR*1.7);
  halo.addColorStop(0, rgba(COL.lime, 0.17));
  halo.addColorStop(1, rgba(COL.lime, 0));
  c.fillStyle = halo;
  c.beginPath(); c.arc(MX, MY, MR*1.7, 0, 6.283); c.fill();

  ringPass(false);          // far arc, occluded by the disc

  c.save();
  c.beginPath(); c.arc(MX, MY, MR, 0, 6.283); c.clip();
  var disc = c.createLinearGradient(MX - MR, MY - MR, MX + MR, MY + MR);
  disc.addColorStop(0, 'rgba(204,254,6,0.46)');
  disc.addColorStop(0.55, 'rgba(150,192,14,0.24)');
  disc.addColorStop(1, 'rgba(40,54,10,0.10)');
  c.fillStyle = disc; c.fillRect(MX - MR, MY - MR, MR*2, MR*2);
  // banded cloud belts
  for(var b=0;b<16;b++){
    var by = MY - MR + b*(MR*2/16) + (frame*0.05 % 8);
    c.fillStyle = rgba(COL.lime, 0.09 + (b % 3)*0.06);
    c.fillRect(MX - MR, by, MR*2, 4 + (b % 4));
  }
  // terminator shadow
  var term = c.createLinearGradient(MX - MR*0.2, 0, MX + MR, 0);
  term.addColorStop(0, 'rgba(4,6,10,0)');
  term.addColorStop(1, 'rgba(4,6,10,0.62)');
  c.fillStyle = term; c.fillRect(MX - MR, MY - MR, MR*2, MR*2);
  c.restore();
  c.strokeStyle = rgba(COL.lime, 0.75); c.lineWidth = 1.8;
  c.beginPath(); c.arc(MX, MY, MR, 0, 6.283); c.stroke();

  ringPass(true);           // near arc, crossing in front of the disc
  addLight(cam.x + MX, MY, 420, COL.lime, 0.16);

  /* ---- skyline silhouettes against the disc ---- */
  drawCity(0.26, 150, 74, '#0C1007', 0.26, 1);
  drawCity(0.46, 118, 112, '#080B05', 0.36, 2);
  var hz = c.createLinearGradient(0, 250, 0, GY);
  hz.addColorStop(0, 'rgba(8,10,6,0.05)');
  hz.addColorStop(1, 'rgba(6,8,5,0.72)');
  c.fillStyle = hz; c.fillRect(0, 250, VW, GY - 250);

  /* ---- deck ---- */
  c.fillStyle = '#070905'; c.fillRect(0, GY, VW, VH - GY);
  c.strokeStyle = COL.lime; c.lineWidth = 2;
  c.beginPath(); c.moveTo(0, GY); c.lineTo(VW, GY); c.stroke();
  c.strokeStyle = rgba(COL.lime, 0.14); c.lineWidth = 1;
  for(var m=0;m<11;m++){
    c.beginPath(); c.moveTo(80 + m*90, GY + 4); c.lineTo(30 + m*118, VH); c.stroke();
  }

  /* ---------------- logo, behind the hero ---------------- */
  var eL = ease(14, 30);
  c.font = '600 104px Newsreader, Georgia, serif';
  var wA = c.measureText('IMPACT').width;
  c.font = '600 22px "IBM Plex Mono", monospace';
  var wTag = c.measureText('RWI').width + 14;
  var lx = MX - (wA + wTag + 12)/2;
  var ly = 246 + (1 - eL)*18;
  c.globalAlpha = eL;
  // drop shadow
  c.font = '600 104px Newsreader, Georgia, serif';
  c.fillStyle = rgba(COL.ink, 0.55);
  c.fillText('IMPACT', lx + 5, ly + 5);
  c.fillStyle = COL.paper;
  c.fillText('IMPACT', lx, ly);
  // lime RWI tag riding the shoulder of the wordmark
  var tagX = lx + wA + 12, tagY = ly - 54;
  c.fillStyle = COL.lime;
  c.fillRect(tagX, tagY, wTag, 26);
  c.fillStyle = COL.ink;
  c.font = '600 22px "IBM Plex Mono", monospace';
  c.fillText('RWI', tagX + 7, tagY + 19);
  c.globalAlpha = 1;
  addLight(cam.x + MX, ly - 26, 260, COL.lime, 0.13*eL);

  /* ---------------- hero: drops in and lands ---------------- */
  var land = clamp((T - 26)/66, 0, 1);
  var eLand = 1 - Math.pow(1 - land, 2.4);
  var SC = 6.1;
  var restY = GY - 36*SC;
  var suitY = -230 + eLand*(restY + 230);
  var landed = land >= 1;
  if(landed) suitY = restY + Math.sin(t*2)*3;

  var hold = player.aim, holdA = player.armAng, holdT = player.armT;
  player.aim = -0.42; player.armAng = Math.PI/2 - 0.34; player.armT = 0; player.cool = 0;
  c.save();
  c.translate(MX - 13*SC, suitY);
  c.scale(SC, SC);
  robotSuit({edge:COL.lime, body:'#242B14', hi:'#3A4520', badge:COL.lime, visor:COL.lime,
             step:0, face:1, thrust:!landed, walk:frame*0.05, grounded:landed,
             vx:0, vy:landed ? 0 : -3});
  c.restore();
  player.aim = hold; player.armAng = holdA; player.armT = holdT;
  addLight(cam.x + MX, suitY + 80, 190, COL.lime, 0.3);

  // touchdown shock ring and settling grit
  if(land >= 1 && T < 150){
    var age = T - 92;
    if(age > 0 && age < 46){
      var f2 = age/46;
      c.globalAlpha = (1 - f2)*0.7;
      c.strokeStyle = COL.lime; c.lineWidth = 3*(1 - f2) + 0.6;
      c.beginPath();
      c.ellipse(MX, GY, 30 + f2*210, 6 + f2*26, 0, 0, 6.283); c.stroke();
      c.globalAlpha = (1 - f2)*0.5;
      for(var d2=0;d2<10;d2++){
        var dx2 = (hash(d2)*2 - 1)*(40 + f2*190);
        c.fillStyle = COL.dim;
        c.fillRect(MX + dx2, GY - f2*30*hash(d2+9), 2, 2);
      }
      c.globalAlpha = 1;
    }
  }

  /* ---------------- carrier + tether ---------------- */
  var msX = 236, msY = 128 + Math.sin(t*2.2 + 1)*8;
  var eShip = ease(0, 40);
  c.globalAlpha = eShip;
  drawCable(staticCable(msX, msY + 11,
                        MX - 13*SC + 14.4*SC, suitY + 17.6*SC, 16));
  c.save();
  c.translate(msX, msY);
  c.rotate(Math.sin(t*2.2)*0.04);
  mothership(0, 0, 0.92, frame*0.6, false, !landed);
  c.restore();
  c.globalAlpha = 1;
  addLight(cam.x + msX, msY, 170, COL.lime, 0.26);

  drawWeather();
  compositeLighting();

  /* ---------------- UI, above the lighting pass ---------------- */
  // eyebrow
  var e1 = ease(6, 24);
  c.globalAlpha = e1;
  c.textAlign = 'center';
  c.fillStyle = COL.mute; c.font = '11px "IBM Plex Mono", monospace';
  c.fillText('R E A L   W O R L D   I M P A C T', MX, 62);
  c.fillStyle = rgba(COL.lime, 0.4);
  c.fillRect(MX - 150, 70, 300*e1, 1);
  c.fillStyle = rgba(COL.warn, 0.85); c.font = '9px "IBM Plex Mono", monospace';
  c.fillText('DEPLOYMENT PROTOCOL 01  //  SECTOR SWEEP', MX, 86);
  c.textAlign = 'left';
  c.globalAlpha = 1;

  // lower bar
  var eBar = ease(96, 26);
  c.globalAlpha = eBar;
  c.fillStyle = 'rgba(5,7,4,0.82)';
  c.fillRect(0, 452, VW, VH - 452);
  c.fillStyle = rgba(COL.lime, 0.35);
  c.fillRect(0, 452, VW, 1);
  c.globalAlpha = 1;

  // control strip, centred
  var caps = pad.connected ?
    [['LS / DPAD','MOVE'], ['A','LIFT'], ['RS','AIM'], ['RT / X','FIRE'],
     ['B','BOARD'], ['LB / RB','WEAPONS']] :
    [['A D','MOVE'], ['W','LIFT'], ['MOUSE','AIM'], ['CLICK','FIRE'],
     ['SPACE','BOARD'], ['1-3 / WHEEL','WEAPONS']];
  c.font = '600 9px "IBM Plex Mono", monospace';
  var total = 0, widths = [];
  for(var k=0;k<caps.length;k++){
    var cw = Math.max(20, c.measureText(caps[k][0]).width + 12);
    var dw = c.measureText(caps[k][1]).width + 16;
    widths.push([cw, dw]); total += cw + dw;
  }
  var cx2 = MX - total/2;
  for(var k2=0;k2<caps.length;k2++){
    var a2 = ease(104 + k2*5, 18);
    keycap(cx2, 466, caps[k2][0], a2);
    c.globalAlpha = a2*0.8;
    c.fillStyle = COL.mute; c.font = '10px "IBM Plex Mono", monospace';
    c.fillText(caps[k2][1], cx2 + widths[k2][0] + 5, 478);
    c.globalAlpha = 1;
    cx2 += widths[k2][0] + widths[k2][1];
  }

  // objective + prompt
  var e6 = ease(120, 22);
  c.globalAlpha = e6;
  c.textAlign = 'center';
  c.fillStyle = COL.mute; c.font = '10px "IBM Plex Mono", monospace';
  c.fillText('THREE SECTORS  ·  THREE BOSSES  ·  ONE SUIT', MX, 500);
  var blink = Math.floor(frame/26) % 2 === 0;
  c.fillStyle = blink ? COL.lime : rgba(COL.lime, 0.4);
  c.font = '600 15px "IBM Plex Mono", monospace';
  var deployPrompt = pad.connected ? 'PRESS ANY GAMEPAD BUTTON TO DEPLOY' :
                     (touchMode ? 'TAP TO DEPLOY' : 'PRESS ANY KEY TO DEPLOY');
  c.fillText(deployPrompt, MX, 524);
  c.textAlign = 'left';
  c.globalAlpha = 1;

  // corner telemetry + brackets
  c.globalAlpha = ease(110, 30)*0.7;
  c.font = '9px "IBM Plex Mono", monospace';
  c.fillStyle = COL.dim;
  c.fillText('BEST IMPACT ' + String(bestScore).padStart(6, '0'), 26, 524);
  c.textAlign = 'right';
  c.fillText(audioStatusText() + '  //  RWI BUILD 01', VW - 26, 524);
  c.textAlign = 'left';
  c.globalAlpha = 1;

  c.globalAlpha = ease(2, 30)*0.5;
  c.strokeStyle = rgba(COL.lime, 0.7); c.lineWidth = 1.4;
  var B = 20, K = 24;
  c.beginPath();
  c.moveTo(B, B + K); c.lineTo(B, B); c.lineTo(B + K, B);
  c.moveTo(VW - B - K, B); c.lineTo(VW - B, B); c.lineTo(VW - B, B + K);
  c.stroke();
  c.globalAlpha = 1;

  // letterbox retracting on entry
  var lb = (1 - ease(0, 22))*76;
  if(lb > 0.5){
    c.fillStyle = '#04060A';
    c.fillRect(0, 0, VW, lb);
    c.fillRect(0, VH - lb, VW, lb);
  }
}

/* ---------- loop ---------- */
var last = performance.now(), acc = 0, STEP = 1000/60;
var perfAcc = 0, perfN = 0;
function loop(now){
  var dt = Math.min(100, now - last); last = now;
  acc += dt;
  var guard = 0;
  while(acc >= STEP && guard < 5){
    if(freeze > 0){ freeze--; frame++; if(shake > 0) shake *= 0.94; }
    else update();
    acc -= STEP; guard++;
  }
  if(guard >= 5) acc = 0;
  draw();
  if(!lowFx){
    perfAcc += dt; perfN++;
    if(perfN >= 45){
      if(perfAcc/perfN > 20.5){ lowFx = true; LIGHT_BUDGET = 30; }
      perfAcc = 0; perfN = 0;
    }
  }
  requestAnimationFrame(loop);
}

buildWorld();
resetPlayer();
bullets = []; foes = []; parts = []; drops = []; boss = null; score = 0; stateTimer = 0;
requestAnimationFrame(loop);

})();
