<script>
"use strict";
(function(){

/* ============================================================
   IMPACT
   An original mech run-and-gun in the vein of 16-bit hover-suit
   shooters. All art, code, audio and level data written here.
   ============================================================ */

var VW = 960, VH = 540;
var WORLD_W = 9600;
var BOSS_GATE = 8560;      // camera locks here
var BASE_ZOOM = 1.20, MIN_ZOOM = 0.90;
var ZOOM = BASE_ZOOM;            // dynamic gameplay magnification
var VIEW_W = VW/ZOOM, VIEW_H = VH/ZOOM;
var CAM_MAX = WORLD_W - VIEW_W;

function setViewZoom(z){
  ZOOM = z;
  VIEW_W = VW/ZOOM; VIEW_H = VH/ZOOM;
  CAM_MAX = WORLD_W - VIEW_W;
}
function cameraSpanW(){ return Math.max(VW, VIEW_W); }

var COL = {
  ink:'#0B0B09', deep:'#141410', panel:'#1C1C14',
  lime:'#CCFE06', dim:'#5A6B0E', dark:'#2F3A08', mute:'#B4C77C',
  warn:'#FF6B2C', red:'#E03A1F', paper:'#F2F2EA', grey:'#4A4A44'
};

var cv = document.getElementById('c');
var ctx = cv.getContext('2d', {alpha:false, desynchronized:true});
ctx.imageSmoothingEnabled = true;

/* ---------- deterministic rng ---------- */
var _seed = 20260812;
function rnd(){ _seed = (_seed*1664525 + 1013904223) >>> 0; return _seed/4294967296; }
function rr(a,b){ return a + rnd()*(b-a); }
function ri(a,b){ return Math.floor(rr(a,b+1)); }

/* ---------- procedural arcade audio ---------- */
var audioCtx = null, masterGain = null, musicGain = null, sfxGain = null, noiseBuffer = null;
var mixCompressor = null, musicDelay = null, musicDelayWet = null, musicDelayFeedback = null;
var audioMuted = false, audioReady = false, audioUnlocking = false, audioChimed = false;
var musicStep = 0, musicNext = 0;
var fallbackMusic = null, fallbackReady = false, fallbackUrls = {};
var sfxLast = {};
var MUSIC_BPM = 132;
var MUSIC_PROGRESSION = [0,-3,5,2];
var MUSIC_PROGRESSION_B = [0,2,-3,5];
var MUSIC_MELODY = [
  12,null,15,17,19,null,17,15, 12,null,10,12,15,null,12,10,
  12,null,15,19,17,null,15,12, 10,null,12,15,17,null,15,12,
   7,null,10,12,15,null,12,10,  7,null,10,12,17,null,15,12,
  12,null,15,17,19,17,15,12, 10,null,12,15,12,null,10,7
];
var MUSIC_MELODY_B = [
  19,null,17,15,12,15,17,null, 19,null,22,19,17,null,15,12,
  17,null,15,12,10,12,15,null, 17,19,17,15,12,null,10,7,
  12,null,15,17,19,22,19,17, 15,null,17,19,22,null,19,17,
  15,null,12,10,7,10,12,null,  15,17,15,12,10,null,7,3
];
var MUSIC_COUNTER = [7,10,12,10,7,3,7,10, 12,10,7,5,7,10,7,3];

function wavBlobUrl(kind, variant){
  var key = kind + ':' + (variant || '');
  if(fallbackUrls[key]) return fallbackUrls[key];
  var sr = 12000, isMusic = kind === 'music';
  var duration = isMusic ? (60/MUSIC_BPM*32) :
    ({jump:.14,thrust:.08,fire:.10,explode:.24,hurt:.20,shield:.16,pickup:.18,dock:.18,select:.08,alarm:.48,start:.34,clear:.48}[kind] || .14);
  var count = Math.ceil(sr*duration), bytes = new ArrayBuffer(44 + count*2), v = new DataView(bytes);
  function str(off,s){ for(var q=0;q<s.length;q++) v.setUint8(off+q,s.charCodeAt(q)); }
  str(0,'RIFF'); v.setUint32(4,36+count*2,true); str(8,'WAVE'); str(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  str(36,'data'); v.setUint32(40,count*2,true);
  var baseByKind = {jump:210,thrust:72,fire:(variant==='lance'?760:(variant==='burn'?250:(variant==='heavy'?105:220))),
    explode:86,hurt:190,shield:620,pickup:620,dock:145,select:430,alarm:150,start:330,clear:660};
  var echoLine=isMusic?new Float32Array(Math.ceil(sr*0.18)):null, echoPos=0;
  for(var i=0;i<count;i++){
    var t=i/sr, sample=0;
    if(isMusic){
      var stepLen=60/MUSIC_BPM/4, step=Math.floor(t/stepLen)%128, ph=(t%stepLen)/stepLen;
      var section=Math.floor(step/64), phraseStep=step%64, bar=Math.floor(phraseStep/16);
      var progression=section?MUSIC_PROGRESSION_B:MUSIC_PROGRESSION;
      var root=45 + progression[bar];
      var leadNote=(section?MUSIC_MELODY_B:MUSIC_MELODY)[phraseStep], lead=0;
      if(leadNote !== null){
        var lf=midiFreq(root+leadNote), leadEnv=Math.min(1,ph*10)*Math.pow(1-ph,1.25);
        lead=Math.sin(6.283*lf*t + Math.sin(6.283*lf*2*t)*2.2)*leadEnv*0.17;
      }
      var beatPh=(t%(stepLen*4))/(stepLen*4), bf=midiFreq(root-12);
      var bass=Math.sin(6.283*bf*t + Math.sin(6.283*bf*2*t)*0.72)*Math.pow(1-beatPh,0.7)*0.13;
      var counter=0;
      if(leadNote===null && ph<0.78){
        var cf=midiFreq(root+MUSIC_COUNTER[(step+bar)%MUSIC_COUNTER.length]);
        counter=Math.sin(6.283*cf*t+Math.sin(6.283*cf*3*t)*0.9)*(1-ph/0.78)*0.060;
      }
      var stab=0;
      if((step%16===0 || step%16===8) && ph<0.82){
        var stabEnv=(1-ph/0.82)*0.035;
        stab=(Math.sin(6.283*midiFreq(root+12)*t)+Math.sin(6.283*midiFreq(root+15)*t)+Math.sin(6.283*midiFreq(root+19)*t))*stabEnv;
      }
      var kick=(step%4===0 && ph<0.30) ? Math.sin(6.283*(78-32*ph)*t)*(1-ph/0.30)*0.18 : 0;
      var snare=((step%16===4 || step%16===12) && ph<0.16) ? (Math.random()*2-1)*(1-ph/0.16)*0.10 : 0;
      var hat=((step%4===2) && ph<0.05) ? (Math.random()*2-1)*(1-ph/0.05)*0.022 : 0;
      var fill=(step>=124 && ph<0.55) ? Math.sin(6.283*(150+(step-124)*45)*t)*(1-ph/0.55)*0.095 : 0;
      sample=lead+counter+bass+stab+kick+snare+hat+fill;
      var delayed=echoLine[echoPos]; echoLine[echoPos]=sample+delayed*0.16;
      sample+=delayed*0.20; echoPos=(echoPos+1)%echoLine.length;
    } else {
      var f=baseByKind[kind]||260, env=Math.max(0,1-t/duration), slide=1;
      if(kind==='jump'||kind==='pickup'||kind==='start'||kind==='clear') slide=1+t/duration*1.1;
      else if(kind==='hurt'||kind==='explode'||variant==='heavy') slide=Math.max(.35,1-t/duration*.65);
      var wave=Math.sin(6.283*f*slide*t)>=0?1:-1;
      sample=wave*env*0.23;
      if(kind==='explode'||kind==='thrust'||variant==='burn') sample+=(Math.random()*2-1)*env*0.18;
      if(kind==='shield'||variant==='lance') sample+=Math.sin(6.283*f*1.5*t)*env*0.15;
    }
    sample=Math.max(-1,Math.min(1,sample));
    v.setInt16(44+i*2, sample*32767, true);
  }
  return (fallbackUrls[key] = URL.createObjectURL(new Blob([bytes],{type:'audio/wav'})));
}

function startFallbackAudio(){
  if(audioMuted) return;
  if(!fallbackMusic){
    fallbackMusic = new Audio(wavBlobUrl('music'));
    fallbackMusic.loop = true; fallbackMusic.volume = 0.44; fallbackMusic.preload = 'auto';
  }
  var fp = fallbackMusic.play();
  if(fp && fp.then) fp.then(function(){ fallbackReady=!!fallbackMusic && !fallbackMusic.paused; }).catch(function(){ fallbackReady=false; });
}

function playFallbackSfx(name, variant){
  if(audioMuted) return;
  var a = new Audio(wavBlobUrl(name, variant));
  a.volume = name === 'thrust' ? 0.28 :
             (name === 'explode' ? 0.40 : ((name === 'fire' && variant === 'vulcan') ? 0.34 : 0.50));
  var p = a.play();
  if(p && p.catch) p.catch(function(){});
}

function audioIsAudible(){
  return !audioMuted && ((audioReady && audioCtx && audioCtx.state==='running') || fallbackReady);
}

function markAudioReady(){
  audioUnlocking = false;
  if(!audioCtx || audioCtx.state !== 'running') return;
  audioReady = true;
  if(fallbackMusic){ fallbackMusic.pause(); fallbackMusic.currentTime=0; fallbackReady=false; }
  musicNext = audioCtx.currentTime + 0.05;
  if(!audioChimed){
    audioChimed = true;
    synthTone(660,0.050,'triangle',0.040,audioCtx.currentTime,820);
    synthTone(880,0.065,'sine',0.035,audioCtx.currentTime+0.050,0);
  }
}

function ensureAudio(){
  var AC = window.AudioContext || window.webkitAudioContext;
  if(!AC){ startFallbackAudio(); return null; }
  if(!audioCtx){
    audioCtx = new AC();
    masterGain = audioCtx.createGain();
    musicGain = audioCtx.createGain();
    sfxGain = audioCtx.createGain();
    mixCompressor = audioCtx.createDynamicsCompressor();
    musicDelay = audioCtx.createDelay(0.5);
    musicDelayWet = audioCtx.createGain();
    musicDelayFeedback = audioCtx.createGain();
    // Keep the music forward while leaving effects enough headroom to avoid
    // fatigue during sustained fire and long jetpack runs.
    masterGain.gain.value = 0.74;
    musicGain.gain.value = 0.64;
    sfxGain.gain.value = 0.62;
    mixCompressor.threshold.value=-18; mixCompressor.knee.value=16; mixCompressor.ratio.value=4;
    mixCompressor.attack.value=0.004; mixCompressor.release.value=0.16;
    musicDelay.delayTime.value=0.18; musicDelayWet.gain.value=0.16; musicDelayFeedback.gain.value=0.14;
    musicGain.connect(masterGain); sfxGain.connect(masterGain);
    musicGain.connect(musicDelay); musicDelay.connect(musicDelayWet); musicDelayWet.connect(masterGain);
    musicDelay.connect(musicDelayFeedback); musicDelayFeedback.connect(musicDelay);
    masterGain.connect(mixCompressor); mixCompressor.connect(audioCtx.destination);

    noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
    var nd = noiseBuffer.getChannelData(0);
    for(var ni=0;ni<nd.length;ni++) nd[ni] = Math.random()*2 - 1;
    musicNext = audioCtx.currentTime + 0.05;
    audioCtx.onstatechange = function(){
      audioReady = audioCtx.state === 'running';
      if(audioReady) markAudioReady();
    };
  }
  if(audioCtx.state === 'running'){
    markAudioReady();
    return Promise.resolve(audioCtx);
  }
  startFallbackAudio();
  // Retry on every genuine interaction. A resume requested from a gamepad
  // poll can remain pending under autoplay rules, while the next click/key is
  // allowed to activate the very same context.
  audioUnlocking = true;
  var attempt = audioCtx.resume();
  if(attempt && attempt.then){
    attempt.then(markAudioReady).catch(function(){ audioUnlocking=false; audioReady=false; });
    return attempt;
  }
  markAudioReady();
  return null;
}

function setAudioMuted(muted){
  audioMuted = muted;
  if(masterGain && audioCtx){
    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
    masterGain.gain.setTargetAtTime(muted ? 0.0001 : 0.74, audioCtx.currentTime, 0.025);
  }
  if(fallbackMusic){
    if(muted){ fallbackMusic.pause(); fallbackReady=false; }
    else startFallbackAudio();
  }
  if(!muted) ensureAudio();
}

function audioStatusText(){
  if(audioMuted) return 'M AUDIO OFF';
  if(audioIsAudible()) return 'M AUDIO ON';
  return 'CLICK / KEY FOR AUDIO';
}

function synthTone(freq, dur, type, vol, when, slide, bus){
  if(!audioCtx || audioMuted) return;
  when = when === undefined ? audioCtx.currentTime : when;
  var o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(Math.max(24, freq), when);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(24, slide), when + dur);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), when + Math.min(0.012, dur*0.2));
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(g); g.connect(bus || sfxGain);
  o.start(when); o.stop(when + dur + 0.02);
}

function fmTone(freq, dur, vol, when, ratio, index, bus){
  if(!audioCtx || audioMuted) return;
  when = when === undefined ? audioCtx.currentTime : when;
  ratio = ratio || 2; index = index === undefined ? 1.5 : index;
  var carrier=audioCtx.createOscillator(), mod=audioCtx.createOscillator();
  var modDepth=audioCtx.createGain(), amp=audioCtx.createGain();
  carrier.type='sine'; mod.type='sine';
  carrier.frequency.setValueAtTime(freq,when); mod.frequency.setValueAtTime(freq*ratio,when);
  modDepth.gain.setValueAtTime(freq*index,when);
  modDepth.gain.exponentialRampToValueAtTime(Math.max(1,freq*0.08),when+dur);
  amp.gain.setValueAtTime(0.0001,when);
  amp.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol),when+Math.min(0.018,dur*0.22));
  amp.gain.exponentialRampToValueAtTime(0.0001,when+dur);
  mod.connect(modDepth); modDepth.connect(carrier.frequency); carrier.connect(amp); amp.connect(bus||musicGain);
  carrier.start(when); mod.start(when); carrier.stop(when+dur+0.02); mod.stop(when+dur+0.02);
}

function noiseHit(dur, vol, cutoff, when, bus, filterType){
  if(!audioCtx || audioMuted || !noiseBuffer) return;
  when = when === undefined ? audioCtx.currentTime : when;
  var n = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
  n.buffer = noiseBuffer; f.type = filterType || 'lowpass'; f.frequency.value = cutoff || 1200;
  g.gain.setValueAtTime(Math.max(0.0002, vol), when);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  n.connect(f); f.connect(g); g.connect(bus || sfxGain);
  n.start(when); n.stop(when + dur + 0.02);
}

function midiFreq(note){ return 440*Math.pow(2, (note-69)/12); }

function playSfx(name, variant){
  if(audioMuted) return;
  var stamp=(audioReady&&audioCtx&&audioCtx.state==='running')?audioCtx.currentTime:performance.now()/1000;
  var gateKey=name+(variant?':'+variant:'');
  var minGap=name==='thrust'?0.24:
             (gateKey==='fire:vulcan'?0.145:(name==='explode'?0.11:(name==='select'?0.09:0.025)));
  if(sfxLast[gateKey] !== undefined && stamp-sfxLast[gateKey] < minGap) return;
  sfxLast[gateKey]=stamp;
  if(!audioReady || !audioCtx || audioCtx.state !== 'running'){
    playFallbackSfx(name, variant);
    return;
  }
  var t = audioCtx.currentTime;
  var jitter = 0.96 + Math.random()*0.08;
  if(name === 'jump'){
    synthTone(180,0.085,'triangle',0.060,t,350); synthTone(105,0.070,'sine',0.035,t,150);
  } else if(name === 'thrust'){
    noiseHit(0.055,0.015,720,t); synthTone(68,0.060,'sine',0.018,t,54);
  } else if(name === 'fire'){
    if(variant === 'heavy'){
      synthTone(98*jitter,0.13,'triangle',0.075,t,48); noiseHit(0.09,0.045,700,t);
    } else if(variant === 'burn'){
      noiseHit(0.075,0.030,1300,t); synthTone(235*jitter,0.065,'triangle',0.034,t,135);
    } else if(variant === 'lance'){
      fmTone(510,0.13,0.065,t,2,2.6,sfxGain); synthTone(250,0.10,'sine',0.035,t,720);
    } else synthTone(205*jitter,0.035,'triangle',0.032,t,145);
  } else if(name === 'explode'){
    noiseHit(0.16,0.062,560*jitter,t); synthTone(82*jitter,0.18,'sine',0.050,t,42);
  } else if(name === 'hurt'){
    synthTone(185,0.17,'triangle',0.070,t,68); noiseHit(0.070,0.032,900,t);
  } else if(name === 'shield'){
    fmTone(470,0.12,0.055,t,2,1.5,sfxGain); synthTone(720,0.085,'sine',0.040,t+0.035,430);
  } else if(name === 'pickup'){
    synthTone(500,0.060,'triangle',0.045,t,650); synthTone(750,0.085,'sine',0.042,t+0.055,940);
  } else if(name === 'dock'){
    synthTone(125,0.10,'triangle',0.055,t,82); synthTone(245,0.060,'sine',0.040,t+0.070,360);
  } else if(name === 'select'){
    synthTone(390,0.040,'sine',0.028,t,490);
  } else if(name === 'alarm'){
    fmTone(145,0.17,0.060,t,2,1.8,sfxGain); fmTone(145,0.17,0.060,t+0.22,2,1.8,sfxGain);
  } else if(name === 'start'){
    fmTone(220,0.085,0.050,t,2,1.4,sfxGain); fmTone(330,0.085,0.050,t+0.085,2,1.4,sfxGain);
    fmTone(495,0.14,0.055,t+0.17,2,1.6,sfxGain);
  } else if(name === 'clear'){
    var clearNotes = [52,59,64,71];
    for(var ci=0;ci<clearNotes.length;ci++) fmTone(midiFreq(clearNotes[ci]),0.16,0.050,t+ci*0.10,2,1.5,sfxGain);
  }
}

function scheduleMusicStep(step, at){
  var phraseStep=step%64, s=phraseStep%16, bar=Math.floor(phraseStep/16)%4;
  var section=Math.floor(step/64)%2;
  var stageRoot = [45,48,50][clamp(stage,1,3)-1];
  var root = stageRoot + (section?MUSIC_PROGRESSION_B:MUSIC_PROGRESSION)[bar];
  var melody = (section?MUSIC_MELODY_B:MUSIC_MELODY)[phraseStep];

  // Layered FM lead, counter-line, syncopated bass and PSG accents create an
  // original premium 16-bit action arrangement without sampling another game.
  if(melody !== null) fmTone(midiFreq(root+melody),0.150,0.060,at,2,section?2.8:2.25,musicGain);
  else if(s%2===1) fmTone(midiFreq(root+MUSIC_COUNTER[(s+bar*3)%MUSIC_COUNTER.length]),0.105,0.030,at,3,0.9,musicGain);

  if(s===0||s===3||s===6||s===8||s===11||s===14){
    var bassOffset=(s===6||s===14)?7:0;
    fmTone(midiFreq(root-12+bassOffset),s===0||s===8?0.22:0.13,0.082,at,2,0.72,musicGain);
  }
  if(s === 0 || s === 8){
    fmTone(midiFreq(root+12),0.22,0.022,at,1,0.55,musicGain);
    fmTone(midiFreq(root+15),0.22,0.020,at,1,0.55,musicGain);
    fmTone(midiFreq(root+19),0.22,0.019,at,1,0.55,musicGain);
  }
  if(s === 7 || s === 15) synthTone(midiFreq(root+24),0.040,'square',0.013,at,0,musicGain);
  if(s === 0 || s === 8){ noiseHit(0.068,0.034,360,at,musicGain,'lowpass'); synthTone(56,0.078,'sine',0.040,at,39,musicGain); }
  if(s === 4 || s === 12) noiseHit(0.064,0.027,1450,at,musicGain,'bandpass');
  if(s === 2 || s === 6 || s === 10 || s === 14) noiseHit(0.022,0.010,5200,at,musicGain,'highpass');
  if(step%128>=124) synthTone(145+(step%128-124)*44,0.070,'triangle',0.032,at,95,musicGain);
}

function updateAudio(){
  if(!audioCtx || audioCtx.state !== 'running') return;
  var activeMusic = state === 'play' || state === 'stagec';
  if(audioMuted || !activeMusic){ musicNext = audioCtx.currentTime + 0.05; return; }
  var stepDur = 60/MUSIC_BPM/4;
  if(musicNext < audioCtx.currentTime - 0.10) musicNext = audioCtx.currentTime + 0.03;
  while(musicNext < audioCtx.currentTime + 0.16){
    scheduleMusicStep(musicStep, musicNext);
    musicStep = (musicStep + 1) % 128;
    musicNext += stepDur;
  }
}

var keys = {};

var pad = {connected:false,index:-1,left:false,right:false,up:false,down:false,fire:false,aimX:0,aimY:0};
var padButtons = [];
function padDeadzone(v){
  var a = Math.abs(v);
  if(a < 0.20) return 0;
  return Math.sign(v) * (a - 0.20) / 0.80;
}
function pollGamepad(){
  if(!navigator.getGamepads) return;
  var list = navigator.getGamepads(), gp = null;
  if(pad.index >= 0 && list[pad.index]) gp = list[pad.index];
  if(!gp){
    for(var gi=0;gi<list.length;gi++) if(list[gi]){ gp = list[gi]; break; }
  }
  if(!gp){
    pad.connected=false; pad.index=-1; pad.left=pad.right=pad.up=pad.down=pad.fire=false;
    pad.aimX=pad.aimY=0; padButtons=[]; return;
  }
  pad.connected = true; pad.index = gp.index;
  var b = [], bi;
  for(bi=0;bi<gp.buttons.length;bi++) b[bi] = !!gp.buttons[bi].pressed || gp.buttons[bi].value > 0.55;
  var edge = function(n){ return !!b[n] && !padButtons[n]; };
  var lx = padDeadzone(gp.axes[0] || 0), ly = padDeadzone(gp.axes[1] || 0);
  pad.aimX = padDeadzone(gp.axes[2] || 0); pad.aimY = padDeadzone(gp.axes[3] || 0);
  pad.left = lx < -0.12 || !!b[14]; pad.right = lx > 0.12 || !!b[15];
  pad.up = ly < -0.18 || !!b[12] || !!b[0]; pad.down = ly > 0.35 || !!b[13];
  pad.fire = !!b[2] || !!b[7];

  var anyEdge = false;
  for(bi=0;bi<b.length;bi++) if(b[bi] && !padButtons[bi]){ anyEdge=true; break; }
  if(anyEdge) ensureAudio();
  if(canStart() && anyEdge){ startRun(); padButtons=b; return; }
  if(edge(1)) doDock();
  if(edge(4)) cycleWeapon(-1);
  if(edge(5) || edge(3)) cycleWeapon(1);
  if(edge(8)) setAudioMuted(!audioMuted);
  if(edge(9) && state === 'play') paused = !paused;
  padButtons = b;
}

var TILE = 32, COLS = Math.ceil(WORLD_W/TILE);
var ground = new Float32Array(COLS);
var boxes = [];

function buildWorld(){
  _seed = 20260812 + stage*7919;
  var rough = SG().rough;
  var h = 452;
  for(var i=0;i<COLS;i++){
    var x = i*TILE;
    if(x > BOSS_GATE - 220){ h = 452; }
    else if(i % 9 === 0 && rnd() < 0.36 + 0.10*rough){
      h += (rnd() < 0.5 ? -1 : 1) * (rnd()<0.6 ? 36 : 72) * rough;
      h = Math.max(292, Math.min(468, h));
    }
    ground[i] = h;
  }
  boxes.length = 0;
  for(var x2=760; x2 < BOSS_GATE - 420; x2 += ri(260, 620)){
    var gy = groundAt(x2);
    var w = ri(1,3)*44, hh = ri(1,3)*40;
    boxes.push({x:x2, y:gy - hh, w:w, h:hh});
  }
}
function groundAt(x){
  var i = Math.floor(x/TILE);
  if(i < 0) i = 0; if(i >= COLS) i = COLS-1;
  return ground[i];
}

function spawnStage(){
  var S = SG(), x = 900;
  while(x < BOSS_GATE - 300){
    var roll = rnd();
    if(stage >= 3 && roll > 0.82) addFoe('lancer', x, groundAt(x) - 26);
    else if(stage >= 2 && roll > 0.70) addFoe('mortar', x, groundAt(x) - 28);
    else if(roll < 0.36) addFoe('walker', x, groundAt(x) - 34);
    else if(roll < 0.68) addFoe('drone', x, rr(180, 330));
    else addFoe('turret', x, groundAt(x) - 26);
    if(rnd() < S.extra) addFoe('drone', x + ri(60,140), rr(160, 300));
    x += ri(S.gap[0], S.gap[1]);
  }
}

function foeClearOfBoxes(f, pad){
  pad = pad || 0;
  for(var i=0;i<boxes.length;i++){
    var b = boxes[i];
    if(f.x < b.x + b.w + pad && f.x + f.w > b.x - pad &&
       f.y < b.y + b.h + pad && f.y + f.h > b.y - pad) return false;
  }
  return true;
}

function addFoe(kind, x, y){
  var P = SG().pow;
  var f = {kind:kind, x:x, y:y, vx:0, vy:0, cool:ri(20,110), t:rr(0,6.28), hit:0, alive:true, chg:0};
  if(kind==='walker'){ f.w=30; f.h=34; f.hp=34; f.pts=100; }
  if(kind==='drone'){  f.w=28; f.h=20; f.hp=22; f.pts=80; f.homeY=y; }
  if(kind==='turret'){ f.w=34; f.h=26; f.hp=52; f.pts=120; }
  if(kind==='mortar'){ f.w=32; f.h=28; f.hp=62; f.pts=170; }
  if(kind==='lancer'){ f.w=28; f.h=26; f.hp=44; f.pts=190; }

  // Search outward from the requested point until the full enemy bounds have
  // clearance from every obstacle. Ground units stay on terrain; airborne
  // units may also move upward to clear tall stacks.
  var spawnX = x, spawnY = y, airborne = kind === 'drone', placed = false;
  for(var n=0;n<17 && !placed;n++){
    var ring = n === 0 ? 0 : Math.ceil(n/2);
    var dir = n === 0 ? 0 : (n % 2 ? 1 : -1);
    var nx = clamp(spawnX + dir*ring*40, 0, WORLD_W - f.w);
    if(airborne){
      var baseY = Math.min(spawnY, groundAt(nx + f.w/2) - f.h - 18);
      for(var rise=0;rise<6;rise++){
        f.x = nx; f.y = Math.max(-20, baseY - rise*34);
        if(foeClearOfBoxes(f, 6)){ placed = true; break; }
      }
    } else {
      f.x = nx; f.y = groundAt(nx + f.w/2) - f.h;
      if(foeClearOfBoxes(f, 6)) placed = true;
    }
  }
  if(!placed) return null;
  if(airborne) f.homeY = f.y;
  f.hp = Math.round(f.hp * P);
  foes.push(f);
  return f;
}

/* ---------- helpers ---------- */
function aabb(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }
function dist(ax,ay,bx,by){ var dx=ax-bx, dy=ay-by; return Math.sqrt(dx*dx+dy*dy); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function angLerp(a, b, t){
  var d = ((b - a + Math.PI) % (Math.PI*2) + Math.PI*2) % (Math.PI*2) - Math.PI;
  return a + d*t;
}

  for(var i=0;i<n;i++){
    var a = rr(0,6.283), sp = rr(spd*0.25, spd);

  }
  // debris chunks + smoke for larger blasts
  if(n >= 8){
    for(var d=0; d<Math.min(7, Math.round(n/3)); d++){

function playerFire(){

  var ox = player.x + am.x + Math.cos(player.aim)*reach;

  if(player.weapon >= player.weaponsUnlocked) player.weapon = 0;

/* ---------- collision ---------- */
function solveBoxes(e){
  for(var i=0;i<boxes.length;i++){
    var b = boxes[i];
    if(!aabb(e,b)) continue;
    var ox1 = (b.x + b.w) - e.x;          // push right
    var ox2 = (e.x + e.w) - b.x;          // push left
    var oy1 = (b.y + b.h) - e.y;          // push down
    var oy2 = (e.y + e.h) - b.y;          // push up
    var mx = Math.min(ox1, ox2), my = Math.min(oy1, oy2);
    if(mx < my){
      if(ox1 < ox2){ e.x += ox1; } else { e.x -= ox2; }
      e.vx = 0;
    } else {
      if(oy2 < oy1){ e.y -= oy2; e.vy = 0; e.grounded = true; }
      else { e.y += oy1; if(e.vy < 0) e.vy = 0; }
    }
  }
}
function bulletHitsScenery(b){
  if(b.y > groundAt(b.x) ) return true;
  if(b.x < 0 || b.x > WORLD_W || b.y < -60) return true;
  for(var i=0;i<boxes.length;i++){
    var x = boxes[i];
    if(b.x > x.x && b.x < x.x+x.w && b.y > x.y && b.y < x.y+x.h) return true;
  }
  return false;
}

/* ---------- aim ---------- */
function computeAim(){
  var cx = player.x + player.w/2, cy = player.y + 14;
  // A controller's right stick directly aims in screen/world space.
  if(pad.connected && Math.hypot(pad.aimX, pad.aimY) > 0.22){
    player.aim = Math.atan2(pad.aimY, pad.aimX);
    return;
  }
  // 8-way keyboard aim takes priority when arrows held
  var ax = 0, ay = 0;
  if(keys['arrowleft'])  ax -= 1;
  if(keys['arrowright']) ax += 1;
  if(keys['arrowup'])    ay -= 1;
  if(keys['arrowdown'])  ay += 1;
  if(ax || ay){ player.aim = Math.atan2(ay, ax); return; }

  if(touchMode || !mouse.active){
    // auto-lock to nearest threat, else level with facing
    var best = null, bd = 720;
    for(var i=0;i<foes.length;i++){
      var f = foes[i];
      var d = dist(cx, cy, f.x+f.w/2, f.y+f.h/2);
      if(d < bd){ bd = d; best = f; }
    }
    if(boss){ var db = dist(cx, cy, boss.x+boss.w/2, boss.y+boss.h/2); if(db < bd){ bd = db; best = boss; } }
    if(best){ player.aim = Math.atan2((best.y+best.h/2) - cy, (best.x+best.w/2) - cx); }
    else { player.aim = player.face > 0 ? 0 : Math.PI; }
    return;
  }
  player.aim = Math.atan2(mouse.y - cy, (mouse.x + cam.x) - cx);
}

/* ---------- update ---------- */
function update(){
  pollGamepad();
  updateAudio();
  frame++;
  if(shake > 0) shake *= 0.88;
  if(flash > 0) flash -= 1;
  if(weaponUnlock.timer > 0) weaponUnlock.timer--;

  if(intro > 0) intro--;
  if(rumble > 0) rumble--;
  if(state === 'stagec'){
    stateTimer++;
    if(stateTimer > 190) nextStage();
    return;
  }
  if(state !== 'play') { stateTimer++; return; }
  if(paused) return;

  updatePlayer();
  updatePartner();
  updateRope();
  updateFoes();
  updateBoss();
  updateBullets();
  updateDrops();
  updateParts();

  // Start easing out well before the normal view would lose the terrain.
  // Smoothstep makes the response gradual, while safeZoom remains a hard
  // fallback that guarantees both the player and ground still fit.
  var localGround = groundAt(player.x + player.w/2);
  var viewTop = player.y - 58;
  var viewBottom = localGround + 34;
  var hardTop = player.y - 48;
  var hardBottom = localGround + 8;
  var altitude = Math.max(0, localGround - (player.y + player.h));
  var zoomT = clamp((altitude - 50)/430, 0, 1);
  zoomT = zoomT*zoomT*(3 - 2*zoomT);
  var targetZoom = BASE_ZOOM + (MIN_ZOOM - BASE_ZOOM)*zoomT;
  var safeZoom = clamp(VH/Math.max(1, hardBottom - hardTop), MIN_ZOOM, BASE_ZOOM);
  var zoomRate = targetZoom < ZOOM ? 0.035 : 0.018;
  var nextZoom = ZOOM + (targetZoom - ZOOM)*zoomRate;
  if(nextZoom > safeZoom) nextZoom = safeZoom;
  setViewZoom(nextZoom);

  // horizontal camera
  var target = clamp(player.x + player.w/2 - VIEW_W*0.42, 0, CAM_MAX);
  if(cam.lock) target = Math.min(target, CAM_MAX);
  if(boss) target = CAM_MAX;
  cam.x += (target - cam.x) * 0.12;

  // Vertically frame the player and the ground together. The hard clamps
  // protect both edges while the camera interpolation catches up.
  var targetY = clamp((viewTop + viewBottom - VIEW_H)*0.5, -150, 92);
  cam.y += (targetY - cam.y) * 0.075;
  cam.y = Math.min(cam.y, hardTop);
  cam.y = Math.max(cam.y, hardBottom - VIEW_H);
  if(cam.lock) cam.x = Math.max(cam.x, BOSS_GATE - 40);

  // boss gate
  if(!boss && !cam.lock && player.x > BOSS_GATE){
    cam.lock = true;
    spawnBoss();
  }

  if(player.hp <= 0 && state === 'play'){
    state = 'over'; stateTimer = 0;
    if(score > bestScore) bestScore = score;
    burst(player.x+13, player.y+18, 40, COL.warn, 6, 50);
    shake = 24;
  }
}

function updatePlayer(){
  var p = player;
  if(p.inv > 0) p.inv--;
  if(p.hitFlash > 0) p.hitFlash--;
  if(p.cool > 0) p.cool--;
  if(p.dockCd > 0) p.dockCd--;

  var boost = p.spdT > 0 ? 1.32 : 1;
  var accel = (p.docked ? 1.05 : 0.72) * boost;
  var maxv  = (p.docked ? 7.6  : 5.0) * boost;

  if(held('left'))  { p.vx -= accel; p.face = -1; }
  if(held('right')) { p.vx += accel; p.face =  1; }
  if(!held('left') && !held('right')) p.vx *= p.grounded ? 0.74 : 0.90;
  p.vx = clamp(p.vx, -maxv, maxv);

  p.thrusting = false;
  var lift = held('thrust');
  if(lift) p.liftHold++; else p.liftHold = 0;
  if(p.docked){
    // free flight, constant solar burn
    p.solar -= 0.34;
    if(lift) { p.vy -= 0.85; p.thrusting = true; if(frame % 12 === 0) playSfx('thrust'); }
    else if(held('down')) p.vy += 0.75;
    else p.vy *= 0.90;
    p.vy = clamp(p.vy, -7.2, 7.2);
    if(p.solar <= 2) undock();
  } else {
    // A fresh press on the ground performs a real jump. Holding the same
    // input transitions into jetpack thrust after the jump has had a moment
    // to rise on its own. A fresh press that begins in mid-air ignites at once.
    var jumpFromGround = lift && p.liftHold === 1 && p.grounded;
    var igniteInAir = lift && p.liftHold === 1 && !p.grounded;
    if(igniteInAir) p.liftHold = JETPACK_DELAY + 1;
    if(jumpFromGround){
      p.vy = JUMP_VY * (p.spdT > 0 ? 1.08 : 1);
      p.jumpArc = JETPACK_DELAY;
      p.grounded = false;
      burst(p.x + p.w/2, p.y + p.h, 5, COL.dim, 2.2, 14);
      playSfx('jump');
    }
    if(lift && (igniteInAir || p.liftHold > JETPACK_DELAY) && p.solar > 0.6){
      p.vy -= 1.02 * (p.spdT > 0 ? 1.12 : 1); p.thrusting = true; p.solar -= 0.62;
      if(frame % 3 === 0) smoke(p.x + p.w/2 + rr(-6,6), p.y + p.h - 2, COL.dim);
      if(igniteInAir || frame % 12 === 0) playSfx('thrust');
    }
    p.vy += 0.56;
    // The unassisted jump gets a slightly higher initial arc without raising
    // the sustained jetpack's normal top speed.
    var riseCap = p.jumpArc > 0 && !p.thrusting ? -8.85 : -6.4;
    p.vy = clamp(p.vy, riseCap, 12);
    if(p.jumpArc > 0) p.jumpArc--;
  }

  // solar regen: fast when grounded and idle, slow in air
  if(!p.docked && !p.thrusting){
    p.solar += p.grounded ? 1.05 : 0.34;
  }
  p.solar = clamp(p.solar, 0, p.maxsolar);

  p.grounded = false;
  p.x += p.vx; solveBoxes(p);
  p.y += p.vy; solveBoxes(p);

  p.x = clamp(p.x, cam.lock ? BOSS_GATE - 30 : 0, WORLD_W - p.w);

  var gy = groundAt(p.x + p.w/2);
  if(p.y + p.h > gy){ p.y = gy - p.h; p.vy = 0; p.grounded = true; }
  if(p.y < -40){ p.y = -40; p.vy = 0; }

  if(Math.abs(p.vx) > 0.4 && p.grounded) p.walk += 0.22; else p.walk *= 0.9;

  // embers shed into world space: they inherit motion and drift behind
  if(!p.docked && frame % 4 === 0 && parts.length < 560){
    parts.push({kind:'spark',
      x: p.x + 13 + p.face*4.8 + rr(-2.4, 2.4),
      y: p.y + 14.5 + rr(-1.5, 1.5),
      px: p.x + 13 + p.face*4.8, py: p.y + 15.5,
      vx: -p.vx*0.28 - p.face*0.35 + rr(-0.22, 0.22),
      vy: -0.75 - p.vy*0.18 + rr(-0.2, 0.1),
      life: 26, max: 26,
      col: (frame % 10 === 0) ? COL.paper : COL.lime, r: rr(0.7, 1.3)});
  }

  computeAim();
  if(held('fire') && p.cool <= 0) playerFire();

  // arm settles to a relaxed carry when it hasn't fired recently
  if(p.ocT > 0) p.ocT--;
  if(p.spT > 0) p.spT--;
  if(p.arT > 0) p.arT--;
  if(p.spdT > 0) p.spdT--;
  if(p.comboT > 0){ p.comboT--; if(p.comboT === 0) p.combo = 0; }
  if(p.armHold > 0) p.armHold--;
  var wantAim = (held('fire') || p.armHold > 0 || p.cool > 0) ? 1 : 0;
  p.armT += (wantAim - p.armT) * (wantAim ? 0.34 : 0.075);
  p.armT = clamp(p.armT, 0, 1);
  // relaxed pose: hanging just forward of vertical, swinging with the gait
  var swing = p.grounded ? Math.sin(p.walk + Math.PI)*0.24 : -0.18;
  var rest = Math.PI/2 - p.face*0.30 + swing*p.face;
  p.armAng = angLerp(rest, p.aim, p.armT);
}

function updatePartner(){
  var q = partner;
  q.bob += 0.06;
  if(!q.active){ return; }
  var tx = player.x - player.face*58, ty = player.y - 42 + Math.sin(q.bob)*7;
  q.vx += (tx - q.x) * 0.014; q.vy += (ty - q.y) * 0.016;
  q.vx *= 0.90; q.vy *= 0.90;
  q.x += q.vx; q.y += q.vy;
  if(q.cool > 0) q.cool--;

  // support fire
  if(q.cool <= 0){
    var best = null, bd = 560;
    for(var i=0;i<foes.length;i++){
      var f = foes[i], d = dist(q.x, q.y, f.x, f.y);
      if(d < bd){ bd = d; best = f; }
    }
    if(!best && boss && dist(q.x,q.y,boss.x,boss.y) < 700) best = boss;
    if(best){
      var a = Math.atan2((best.y + best.h/2) - q.y, (best.x + best.w/2) - q.x);
      shoot(q.x + 16, q.y + 8, a, 11, 7, 'aid', 'p');
      q.cool = 34;
    }
  }
}

function nextStage(){
  stage++;
  buildWorld();
  bullets = []; foes = []; parts = []; drops = []; decals = [];
  boss = null; intro = 0; freeze = 0; ropeReady = false;
  player.x = 140; player.y = 300; player.vx = 0; player.vy = 0;
  player.inv = 70; player.combo = 0; player.comboT = 0;
  if(player.docked) undock();
  // Preserve the exact integrity remaining at the end of the previous sector.
  player.solar = player.maxsolar;
  setViewZoom(BASE_ZOOM);
  cam = {x:0, y:92, lock:false};
  spawnStage();
  state = 'play'; stateTimer = 0;
}

function updateRope(){
  if(!partner.active || player.docked){ ropeReady = false; return; }
  var A = shipPort(), B = suitPort();

  if(!ropeReady || rope.length !== ROPE_N){
    rope = [];
    for(var i=0;i<ROPE_N;i++){
      var t = i/(ROPE_N-1);
      var x = A.x + (B.x - A.x)*t, y = A.y + (B.y - A.y)*t;
      rope.push({x:x, y:y, px:x, py:y});
    }
    ropeReady = true;
  }

  // integrate: inherited momentum plus a little gravity and drag
  for(var j=1;j<ROPE_N-1;j++){
    var pt = rope[j];
    var vx = (pt.x - pt.px)*0.94, vy = (pt.y - pt.py)*0.94;
    pt.px = pt.x; pt.py = pt.y;
    pt.x += vx; pt.y += vy + 0.34;
  }

  // segment length carries a little slack so it bows when the carrier closes in
  var d = dist(A.x, A.y, B.x, B.y);
  var seg = Math.max(d/(ROPE_N-1)*1.06, 3.6);

  for(var it=0; it<7; it++){
    rope[0].x = A.x; rope[0].y = A.y;
    rope[ROPE_N-1].x = B.x; rope[ROPE_N-1].y = B.y;
    for(var k=0;k<ROPE_N-1;k++){
      var a = rope[k], b = rope[k+1];
      var dx = b.x - a.x, dy = b.y - a.y;
      var l = Math.sqrt(dx*dx + dy*dy) || 0.0001;
      var f = ((l - seg)/l) * 0.5;
      var ox = dx*f, oy = dy*f;
      if(k > 0){ a.x += ox; a.y += oy; }
      if(k + 1 < ROPE_N-1){ b.x -= ox; b.y -= oy; }
    }
  }
  rope[0].x = A.x; rope[0].y = A.y;
  rope[ROPE_N-1].x = B.x; rope[ROPE_N-1].y = B.y;
}

function updateFoes(){
  for(var i=foes.length-1;i>=0;i--){
    var f = foes[i];
    if(f.hit > 0) f.hit--;
    var onScreen = f.x > cam.x - 220 && f.x < cam.x + cameraSpanW() + 220;
    if(!onScreen){ continue; }

    var pcx = player.x + player.w/2, pcy = player.y + player.h/2;
    var d = dist(f.x, f.y, pcx, pcy);

    if(f.kind === 'walker'){
      if(d < 520){
        var dir = pcx > f.x ? 1 : -1;
        f.vx += dir * 0.09;
        f.vx = clamp(f.vx, -1.9, 1.9);
      } else f.vx *= 0.9;
      f.x += f.vx;
      f.y = groundAt(f.x + f.w/2) - f.h;
      f.t += 0.12;
      if(--f.cool <= 0 && d < 560){
        var a = Math.atan2(pcy - (f.y+10), pcx - (f.x+f.w/2));
        shoot(f.x + f.w/2, f.y + 10, a, 4.6, 12, 'foe', 'e');
        f.cool = ri(70, 110);
      }
    }
    else if(f.kind === 'drone'){
      f.t += 0.045;
      var tx = pcx + (f.x < pcx ? -170 : 170);
      f.vx += (tx - f.x) * 0.0022;
      f.vx = clamp(f.vx, -2.6, 2.6);
      f.x += f.vx;
      f.y = f.homeY + Math.sin(f.t*1.7) * 44;
      if(--f.cool <= 0 && d < 520){
        var a2 = Math.atan2(pcy - f.y, pcx - f.x);
        shoot(f.x + 14, f.y + 10, a2, 5.4, 10, 'foe', 'e');
        f.cool = ri(60, 100);
      }
    }
    else if(f.kind === 'mortar'){
      // lobs arcing shells: safe up close, punishing at range
      f.y = groundAt(f.x + f.w/2) - f.h;
      f.t += 0.03;
      if(--f.cool <= 0 && d < 760 && d > 130){
        var dx3 = pcx - (f.x + f.w/2);
        var up = -7.4 - Math.abs(dx3)*0.004;
        bullets.push({x:f.x + f.w/2, y:f.y + 6, vx:clamp(dx3*0.021, -6, 6), vy:up,
          dmg:16, type:'shell', owner:'e', life:220, pierce:false, hits:[]});
        f.cool = ri(100, 150);
      }
    }
    else if(f.kind === 'lancer'){
      // winds up, then charges along the deck
      f.y = groundAt(f.x + f.w/2) - f.h;
      if(f.chg > 0){
        f.chg--;
        f.x += f.vx;
        f.vx *= 0.995;
        if(frame % 3 === 0) spark(f.x + f.w/2, f.y + f.h, rr(-1,1), rr(-1.5,0), COL.warn, 16, 1.6);
      } else if(--f.cool <= 0 && d < 460){
        f.vx = (pcx > f.x ? 1 : -1) * 7.4;
        f.chg = 42;
        f.cool = ri(120, 170);
        burst(f.x + f.w/2, f.y + f.h/2, 6, COL.warn, 3, 16);
      } else {
        f.vx *= 0.9; f.x += f.vx;
      }
    }
    else { // turret
      f.y = groundAt(f.x + f.w/2) - f.h;
      f.t = Math.atan2(pcy - (f.y+8), pcx - (f.x+f.w/2));
      if(--f.cool <= 0 && d < 620){
        for(var k=-1;k<=1;k++) shoot(f.x+f.w/2, f.y+8, f.t + k*0.13, 6.2, 11, 'foe', 'e');
        f.cool = ri(110, 160);
      }
    }

    // contact damage
    if(player.inv <= 0 && aabb(player, f))
      hurtPlayer((f.kind === 'lancer' && f.chg > 0) ? 17 : 9, f.x < player.x ? 1 : -1);
  }
}

function updateBoss(){
  if(!boss) return;
  var b = boss;
  b.t++;
  if(b.hit > 0) b.hit--;
  var pcx = player.x + player.w/2, pcy = player.y + player.h/2;
  var ratio = b.hp / b.maxhp;
  b.phase = ratio > 0.62 ? 1 : (ratio > 0.28 ? 2 : 3);

  b.modeT--;
  if(b.modeT <= 0){
    var opts = b.phase === 1 ? ['drift','volley'] :
               b.phase === 2 ? ['drift','volley','seed'] :
                               ['volley','charge','seed','charge'];
    b.mode = opts[ri(0, opts.length-1)];
    b.modeT = b.mode === 'charge' ? 110 : ri(120, 190);
    if(b.mode === 'charge'){ b.charge = 30; }
  }

  if(b.mode === 'drift'){
    b.vx += (9150 + Math.sin(b.t*0.014)*180 - b.x) * 0.004;
    b.vy += (200 + Math.sin(b.t*0.021)*70 - b.y) * 0.005;
  } else if(b.mode === 'volley'){
    b.vx += (9180 - b.x) * 0.004;
    b.vy += (pcy - 120 - b.y) * 0.006;
    var rate = b.phase === 3 ? 16 : (b.phase === 2 ? 26 : 34);
    if(b.t % rate === 0){
      var base = Math.atan2(pcy - (b.y+70), pcx - (b.x+30));
      var spread = b.phase === 3 ? 3 : 2;
      for(var i=-spread;i<=spread;i++)
        shoot(b.x + 26, b.y + 66, base + i*0.16, 5.6, 14, 'foe', 'e');
    }
  } else if(b.mode === 'seed'){
    b.vy += (170 - b.y) * 0.006;
    b.vx *= 0.94;
    if(b.t % 40 === 0){
      addFoe('drone', b.x + rr(-40, 40), b.y + 40);
      burst(b.x+60, b.y+70, 8, COL.warn, 3, 18);
    }
  } else { // charge
    if(b.charge > 0){ b.charge--; b.vx *= 0.86; b.vy *= 0.86;
      if(b.charge % 4 === 0) burst(b.x+65, b.y+55, 3, COL.red, 2, 12);
    } else {
      var a = Math.atan2(pcy - (b.y+b.h/2), pcx - (b.x+b.w/2));
      b.vx += Math.cos(a)*0.55; b.vy += Math.sin(a)*0.5;
      b.vx = clamp(b.vx,-8,8); b.vy = clamp(b.vy,-7,7);
    }
  }

  b.vx = clamp(b.vx, -8, 8); b.vy = clamp(b.vy, -7, 7);
  b.x += b.vx; b.y += b.vy;
  b.x = clamp(b.x, BOSS_GATE - 20, WORLD_W - b.w - 20);
  b.y = clamp(b.y, 60, 452 - b.h);
  b.vx *= 0.97; b.vy *= 0.97;

  if(player.inv <= 0 && aabb(player, b)) hurtPlayer(16, b.x < player.x ? 1 : -1);

  if(b.hp <= 0){
    for(var j=0;j<8;j++) burst(b.x + rr(0,b.w), b.y + rr(0,b.h), 12, j%2?COL.warn:COL.lime, 6, 60);
    score += 5000;
    if(player.weaponsUnlocked < WEAPONS.length){
      weaponUnlock.name = WEAPONS[player.weaponsUnlocked].name;
      player.weaponsUnlocked++;
      weaponUnlock.timer = 240;
    }
    boss = null; shake = 30; flash = 20; freeze = 14;
    playSfx('clear');
    score += 4000 + stage*1500;
    if(stage < STAGE_COUNT){
      state = 'stagec'; stateTimer = 0;
    } else {
      state = 'win'; stateTimer = 0;
      if(score > bestScore) bestScore = score;
    }
  }
}

function updateBullets(){
  for(var i=bullets.length-1;i>=0;i--){
    var b = bullets[i];
    b.x += b.vx; b.y += b.vy;
    if(b.type === 'burn'){ b.vy += 0.09; if(frame%2===0) smoke(b.x,b.y,COL.warn); }
    if(b.type === 'shell'){ b.vy += 0.17; if(frame%3===0) smoke(b.x,b.y,COL.warn); }
    if(--b.life <= 0){ bullets.splice(i,1); continue; }
    if(bulletHitsScenery(b)){
      var bc = b.owner === 'p' ? COL.lime : COL.warn;
      burst(b.x, b.y, b.type === 'heavy' ? 14 : 4, bc, b.type === 'heavy' ? 5 : 2.4, 14);
      scorch(b.x, Math.min(b.y, groundAt(b.x) - 1), b.type === 'heavy' ? 16 : 6, bc);
      bullets.splice(i,1); continue;
    }
    if(b.x < cam.x - 300 || b.x > cam.x + cameraSpanW() + 300){ bullets.splice(i,1); continue; }

    if(b.owner === 'p'){
      var gone = false;
      for(var k=foes.length-1;k>=0;k--){
        var f = foes[k];
        if(b.x > f.x && b.x < f.x+f.w && b.y > f.y && b.y < f.y+f.h){
          if(b.pierce && b.hits.indexOf(f) >= 0) continue;
          f.hp -= b.dmg; f.hit = 6;
          burst(b.x, b.y, 4, COL.lime, 2.6, 14);
          if(b.type === 'heavy'){
            burst(b.x, b.y, 14, COL.warn, 5, 26);
            for(var m=foes.length-1;m>=0;m--){
              var g = foes[m];
              if(dist(b.x,b.y,g.x+g.w/2,g.y+g.h/2) < 78){ g.hp -= 22; g.hit = 6; }
            }
            shake = Math.max(shake, 7); freeze = Math.max(freeze, 2);
          }
          if(f.hp <= 0) killFoe(k);
          if(b.pierce) b.hits.push(f); else { bullets.splice(i,1); gone = true; }
          break;
        }
      }
      if(gone) continue;
      if(boss && b.x > boss.x && b.x < boss.x+boss.w && b.y > boss.y && b.y < boss.y+boss.h){
        boss.hp -= b.dmg; boss.hit = 5; score += Math.round(b.dmg/2);
        burst(b.x, b.y, 5, COL.lime, 3, 16);
        if(b.type === 'heavy'){ boss.hp -= 12; shake = Math.max(shake,8); burst(b.x,b.y,14,COL.warn,5,26); }
        if(!b.pierce){ bullets.splice(i,1); continue; }
      }
    } else {
      if(player.inv <= 0 &&
         b.x > player.x && b.x < player.x+player.w &&
         b.y > player.y && b.y < player.y+player.h){
        hurtPlayer(b.dmg, Math.sign(b.vx) || 1);
        bullets.splice(i,1); continue;
      }
    }
  }
}

function rollEnemyDrop(){
  var roll = rnd();
  if(roll < 0.080) return 'aid';
  if(roll < 0.150) return 'solar';
  if(roll < 0.165) return 'repair';
  if(roll < 0.177) return 'overclock';
  if(roll < 0.189) return 'barrier';
  if(roll < 0.201) return 'spread';
  if(roll < 0.213) return 'armor';
  if(roll < 0.225) return 'speed';
  if(roll < 0.230) return 'cell';
  return null;
}

function killFoe(idx){
  var f = foes[idx];
  burst(f.x + f.w/2, f.y + f.h/2, 16, COL.warn, 4.5, 34);
  burst(f.x + f.w/2, f.y + f.h/2, 8, COL.lime, 3, 26);
  player.combo++;
  player.comboT = 150;
  var mult = clamp(1 + Math.floor(player.combo/3), 1, 5);
  score += f.pts * mult;
  freeze = Math.max(freeze, 2);
  playSfx('explode');
  var kind = rollEnemyDrop();
  if(kind) drops.push({x:f.x+f.w/2, y:f.y+f.h/2, vy:-2.4, kind:kind, t:0});
  foes.splice(idx,1);
}

function hurtPlayer(dmg, dir){
  if(player.shield > 0){
    player.shield--;
    player.inv = 44;
    burst(player.x + 13, player.y + 18, 14, COL.paper, 4, 26);
    shake = Math.max(shake, 7);
    playSfx('shield');
    return;
  }
  player.combo = 0; player.comboT = 0;
  if(player.arT > 0){
    dmg = Math.max(1, Math.round(dmg * 0.58));
    burst(player.x + 13, player.y + 20, 6, COL.paper, 2.6, 16);
  }
  player.hp -= dmg;
  player.inv = 52;
  player.hitFlash = 12;
  player.vx += dir * 4;
  player.vy -= 2.4;
  shake = Math.max(shake, 9);
  flash = 6; freeze = Math.max(freeze, 3);
  burst(player.x + player.w/2, player.y + player.h/2, 10, COL.red, 3.6, 24);
  playSfx('hurt');
  if(player.docked && player.hp > 0) undock();
}

function updateDrops(){
  for(var i=drops.length-1;i>=0;i--){
    var d = drops[i];
    d.t++;
    d.vy += 0.34; d.y += d.vy;
    var gy = groundAt(d.x);
    if(d.y > gy - 8){ d.y = gy - 8; d.vy *= -0.4; if(Math.abs(d.vy) < 0.6) d.vy = 0; }
    if(dist(d.x, d.y, player.x+player.w/2, player.y+player.h/2) < 34){
      if(d.kind === 'aid'){ player.hp = clamp(player.hp + 10, 0, player.maxhp); score += 10; }
      else if(d.kind === 'solar'){ player.solar = clamp(player.solar + 55, 0, player.maxsolar); score += 25; }
      else if(d.kind === 'repair'){ player.hp = clamp(player.hp + 24, 0, player.maxhp); score += 25; }
      else if(d.kind === 'overclock'){ player.ocT = 600; score += 60; }
      else if(d.kind === 'barrier'){ player.shield = Math.min(3, player.shield + 2); score += 60; }
      else if(d.kind === 'armor'){ player.arT = 780; score += 70; }
      else if(d.kind === 'speed'){ player.spdT = 660; score += 70; }
      else if(d.kind === 'spread'){ player.spT = 600; score += 60; }
      else if(d.kind === 'cell'){
        player.maxsolar += 22; player.solar = player.maxsolar;
        player.maxhp = Math.min(190, player.maxhp + 10);
        player.hp = clamp(player.hp + 20, 0, player.maxhp);
        score += 120;
      }
      burst(d.x, d.y, 12, d.kind==='repair'?COL.paper:(d.kind==='aid'?COL.warn:COL.lime), 3.4, 24);
      playSfx('pickup');
      flash = Math.max(flash, 4);
      drops.splice(i,1); continue;
    }
    if(d.t > 900) drops.splice(i,1);
  }
}

function updateParts(){
  for(var i=parts.length-1;i>=0;i--){
    var p = parts[i];
    if(p.kind === 'smoke'){
      p.x += p.vx; p.y += p.vy;
      p.vy -= 0.012; p.vx *= 0.985; p.r += 0.16;
    } else if(p.kind === 'ring'){
      p.r += (p.rmax - p.r) * 0.24;
    } else if(p.kind === 'flash'){
      p.r *= 0.90;
    } else if(p.kind === 'debris'){
      p.px = p.x; p.py = p.y;
      p.x += p.vx; p.y += p.vy; p.vy += 0.34; p.vx *= 0.99;
      p.rot += p.spin;
      var g = groundAt(p.x);
      if(p.y > g){ p.y = g; p.vy *= -0.36; p.vx *= 0.62; p.spin *= 0.5;
        if(Math.abs(p.vy) < 0.7){ p.vy = 0; p.spin = 0; } }
    } else {
      p.px = p.x; p.py = p.y;
      p.x += p.vx; p.y += p.vy; p.vy += 0.14; p.vx *= 0.955; p.vy *= 0.985;
    }
    if(--p.life <= 0) parts.splice(i,1);
  }
  var partLimit = lowFx ? 360 : 560;
  if(parts.length > partLimit) parts.splice(0, parts.length - partLimit);
}

var _spr = {};
function lightSprite(col){
  if(_spr[col]) return _spr[col];
  var S = 64, cn = mkBuf(S, S), c2 = cn.getContext('2d');

var _rgbaCache = {};
function rgba(hex, a){
  var c = _rgbaCache[hex];
  if(!c){
    var n = parseInt(hex.replace('#',''), 16);
    c = _rgbaCache[hex] = [(n>>16)&255, (n>>8)&255, n&255];
  }
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function hash(n){ var s = Math.sin(n*127.1) * 43758.5453; return s - Math.floor(s); }

/* ======================= SKY ======================= */
function drawSky(){
  var spanW = cameraSpanW();
  var g = wctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0.00, '#05070A');
  g.addColorStop(0.30, '#0B1110');
  g.addColorStop(0.62, '#151B0E');
  g.addColorStop(0.86, '#1E2410');
  g.addColorStop(1.00, '#0B0B09');
  // The gameplay buffer is translated by -cam.y before this layer is drawn.
  // Paint the camera's full world-space view (plus a small guard band) so an
  // upward climb can never expose stale pixels along the top edge.
  wctx.fillStyle = g; wctx.fillRect(-2, cam.y - 2, spanW + 4, VIEW_H + 4);

  // starfield
  for(var i=0;i<80;i++){
    var sx = (hash(i)*1600 - cam.x*0.015) % (spanW + 60);
    if(sx < 0) sx += spanW + 60;
    var sy = hash(i + 99) * 250;
    var tw = 0.30 + 0.70 * Math.abs(Math.sin(frame*0.017 + i*1.7));
    wctx.globalAlpha = tw * 0.62;
    wctx.fillStyle = (i % 11 === 0) ? COL.lime : '#D6E4B4';
    var sz = i % 13 === 0 ? 2 : 1.3;
    wctx.fillRect(sx - 30, sy, sz, sz);
  }
  wctx.globalAlpha = 1;

  // aurora ribbons
  wctx.globalCompositeOperation = 'lighter';
  for(var k=0;k<3;k++){
    var yb = 90 + k*46, amp = 22 + k*10, ph = frame*0.0045 + k*2.1;
    var ag = wctx.createLinearGradient(0, yb - 40, 0, yb + 70);
    ag.addColorStop(0, rgba(COL.lime, 0));
    ag.addColorStop(0.45, rgba(COL.lime, 0.055 - k*0.012));
    ag.addColorStop(1, rgba(COL.lime, 0));
    wctx.fillStyle = ag;
    wctx.beginPath(); wctx.moveTo(0, VH);
    for(var x=0;x<=spanW;x+=16){
      var wx2 = x + cam.x*0.02;
      wctx.lineTo(x, yb + Math.sin(wx2*0.006 + ph)*amp + Math.sin(wx2*0.017 - ph*1.7)*amp*0.4);
    }
    wctx.lineTo(spanW, yb + 90); wctx.lineTo(0, yb + 90); wctx.closePath(); wctx.fill();
  }
  wctx.globalCompositeOperation = 'source-over';

  drawSun();
  drawClouds();
}

function drawSun(){
  var x = 762 - cam.x*0.035, y = 100, R = 52;

  // volumetric shafts
  wctx.save();
  wctx.globalCompositeOperation = 'lighter';
  wctx.translate(x, y);
  for(var i=0;i<5;i++){
    var a = frame*0.0018 + i*1.257;
    wctx.save(); wctx.rotate(a);
    var sg = wctx.createLinearGradient(0, 0, 0, 420);
    sg.addColorStop(0, rgba(COL.lime, 0.045));
    sg.addColorStop(1, rgba(COL.lime, 0));
    wctx.fillStyle = sg;
    wctx.beginPath(); wctx.moveTo(-14, 0); wctx.lineTo(14, 0);
    wctx.lineTo(62, 420); wctx.lineTo(-62, 420); wctx.closePath(); wctx.fill();
    wctx.restore();
  }
  wctx.restore();

  // halo
  var hg = wctx.createRadialGradient(x, y, R*0.6, x, y, R*2.6);
  hg.addColorStop(0, rgba(COL.lime, 0.09));
  hg.addColorStop(1, rgba(COL.lime, 0));
  wctx.fillStyle = hg;
  wctx.beginPath(); wctx.arc(x, y, R*2.6, 0, 6.283); wctx.fill();

  // disc
  var dg = wctx.createLinearGradient(x, y - R, x, y + R);
  dg.addColorStop(0, 'rgba(204,254,6,0.20)');
  dg.addColorStop(1, 'rgba(204,254,6,0.05)');
  wctx.fillStyle = dg;
  wctx.beginPath(); wctx.arc(x, y, R, 0, 6.283); wctx.fill();
  wctx.strokeStyle = rgba(COL.lime, 0.75); wctx.lineWidth = 2;
  wctx.stroke();

  // scan bands
  wctx.save();
  wctx.beginPath(); wctx.arc(x, y, R - 1, 0, 6.283); wctx.clip();
  for(var b=0;b<9;b++){
    var by = y - R + b*12 + (frame*0.16 % 12);
    wctx.fillStyle = rgba(COL.lime, 0.10 + (b % 3) * 0.05);
    wctx.fillRect(x - R, by, R*2, 3);
  }
  wctx.restore();
  addLight(x, y, 200, COL.lime, 0.18);
}

function drawIndustrial(){

      wctx.fillRect(x, base - gh, 9, gh);
      wctx.fillRect(x + 132, base - gh, 9, gh);
      wctx.fillRect(x - 16, base - gh - 12, 176, 12);
      wctx.fillStyle = 'rgba(204,254,6,0.22)';
      wctx.fillRect(x - 16, base - gh - 12, 176, 1.5);

      wctx.strokeStyle = body; wctx.lineWidth = 3;

      }

      wctx.fillRect(tx2 + 10, base - gh - 2, 2, 46);

  for(var fpx=-foff; fpx<spanW; fpx+=fenceStep){
    wctx.moveTo(fpx, 452); wctx.lineTo(fpx + fenceStep, 428);

  }
  wctx.stroke();
  wctx.fillStyle = 'rgba(204,254,6,0.12)';

function drawCity(par, spacing, baseH, col, lit, seedOff){
  var spanW = cameraSpanW();
  var off = cam.x * par;
  var first = Math.floor(off / spacing) - 1;
  for(var i=first;i<first + Math.ceil(spanW/spacing) + 3;i++){
    var bx = i*spacing - off;
    var h = baseH + hash(i*3.7 + seedOff)*baseH*1.15;
    var w = spacing*0.52 + hash(i*1.9 + seedOff)*spacing*0.24;
    var top = 424 - h;
    wctx.fillStyle = col;
    wctx.fillRect(bx, top, w, h + 60);
    // roof cap
    wctx.fillStyle = rgba(COL.lime, 0.10 * lit);
    wctx.fillRect(bx, top, w, 2);
    // setback block
    if(hash(i*5.1 + seedOff) > 0.55){
      var sw = w*0.5;
      wctx.fillStyle = col;
      wctx.fillRect(bx + w*0.25, top - 26, sw, 28);
      wctx.fillStyle = rgba(COL.lime, 0.10*lit);
      wctx.fillRect(bx + w*0.25, top - 26, sw, 2);
    }
    // mast + beacon
    if(hash(i*8.3 + seedOff) > 0.62){
      var mx = bx + w*0.5;
      wctx.strokeStyle = 'rgba(90,107,14,' + (0.45*lit) + ')';
      wctx.lineWidth = 1.4;
      wctx.beginPath(); wctx.moveTo(mx, top); wctx.lineTo(mx, top - 34); wctx.stroke();
      var blink = (Math.sin(frame*0.05 + i) > 0.55);
      if(blink){
        wctx.fillStyle = COL.red;
        wctx.fillRect(mx - 1.5, top - 37, 3, 3);
        if(par > 0.4) addLight(mx, top - 36, 18, COL.red, 0.30);
      }
    }
    // windows
    var cols = Math.max(2, Math.floor(w / 14));
    var rows = Math.floor(h / 20);
    var detailStep = lowFx ? 2 : 1;
    for(var c=0;c<cols;c+=detailStep){
      for(var r=0;r<rows;r+=detailStep){
        var key = i*31 + c*7 + r*13 + seedOff*97;
        var on = hash(key);
        if(on > 0.62){
          var flick = (hash(key + Math.floor(frame/34)) > 0.06) ? 1 : 0.25;
          wctx.fillStyle = rgba(on > 0.94 ? COL.paper : COL.lime, (0.13 + on*0.20) * lit * flick);
          wctx.fillRect(bx + 6 + c*14, top + 12 + r*20, 6, 9);
        }
      }
    }
  }
}

/* ======================= TERRAIN ======================= */
function drawTerrain(){
  var spanW = cameraSpanW();
  var start = Math.floor(cam.x/TILE) - 1;
  var count = Math.ceil(spanW/TILE) + 3;

  function profile(){
    wctx.beginPath();
    wctx.moveTo(-40, VH + 10);
    for(var i=start;i<start+count;i++){
      var idx = clamp(i, 0, COLS-1), sxp = i*TILE - cam.x;
      wctx.lineTo(sxp, ground[idx]);
      wctx.lineTo(sxp + TILE, ground[idx]);
    }
    wctx.lineTo(spanW + 40, VH + 10);
    wctx.closePath();
  }

  profile();
  var tg = wctx.createLinearGradient(0, 280, 0, VH);
  tg.addColorStop(0, '#2A3118');
  tg.addColorStop(0.20, '#1A1F11');
  tg.addColorStop(1, '#070806');
  wctx.fillStyle = tg; wctx.fill();

  // strata + surface furniture, clipped to the ground body
  wctx.save();
  profile(); wctx.clip();

  // strata bands following the profile
  for(var b=1;b<=4;b++){
    wctx.beginPath();
    for(var i2=start;i2<start+count;i2++){
      var idx2 = clamp(i2, 0, COLS-1), sx2 = i2*TILE - cam.x;
      var yy = ground[idx2] + b*b*7 + 6;
      wctx.lineTo(sx2, yy); wctx.lineTo(sx2 + TILE, yy);
    }
    wctx.strokeStyle = 'rgba(90,107,14,' + (0.16 / b) + ')';
    wctx.lineWidth = 1; wctx.stroke();
  }

  // sub-surface aggregate
  for(var r=0;r<70;r++){
    var rx = (hash(r*3.1)*WORLD_W) % WORLD_W;
    var sxr = rx - cam.x;
    if(sxr < -30 || sxr > spanW + 30) continue;
    var ry = groundAt(rx) + 12 + hash(r*7.7)*70;
    wctx.fillStyle = 'rgba(90,107,14,0.13)';
    wctx.beginPath(); wctx.arc(sxr, ry, 2 + hash(r*5.3)*4, 0, 6.283); wctx.fill();
  }

  // ambient bounce under the lip
  for(var band=0;band<3;band++){
    wctx.fillStyle = 'rgba(204,254,6,' + (0.05 - band*0.015) + ')';
    for(var i3=start;i3<start+count;i3++){
      var idx3 = clamp(i3, 0, COLS-1);
      wctx.fillRect(i3*TILE - cam.x, ground[idx3] + band*7, TILE + 1, 7);
    }
  }

  // scorch decals
  for(var d=0;d<decals.length;d++){
    var dc = decals[d], dsx = dc.x - cam.x;
    if(dsx < -40 || dsx > spanW + 40) continue;
    var dg2 = wctx.createRadialGradient(dsx, dc.y, 0, dsx, dc.y, dc.r);
    dg2.addColorStop(0, 'rgba(7,8,6,' + dc.a + ')');
    dg2.addColorStop(0.7, 'rgba(7,8,6,' + dc.a*0.5 + ')');
    dg2.addColorStop(1, 'rgba(7,8,6,0)');
    wctx.fillStyle = dg2;
    wctx.beginPath(); wctx.arc(dsx, dc.y, dc.r, 0, 6.283); wctx.fill();
  }
  wctx.restore();

  // crust: dark base line, then hot edge
  wctx.beginPath();
  for(var j=start;j<start+count;j++){
    var id2 = clamp(j, 0, COLS-1), sxj = j*TILE - cam.x;
    wctx.lineTo(sxj, ground[id2]); wctx.lineTo(sxj + TILE, ground[id2]);
  }
  wctx.strokeStyle = '#3E4A0A'; wctx.lineWidth = 5; wctx.stroke();
  wctx.strokeStyle = COL.lime;  wctx.lineWidth = 2; wctx.stroke();
  wctx.strokeStyle = 'rgba(242,242,234,0.55)'; wctx.lineWidth = 0.8; wctx.stroke();

  // surface furniture: rivets, rebar, markers
  for(var k=start;k<start+count;k++){
    var idk = clamp(k, 0, COLS-1), sxk = k*TILE - cam.x, gy = ground[idk];
    var hv = hash(k*2.3);
    if(hv > 0.80){
      wctx.strokeStyle = 'rgba(90,107,14,0.8)'; wctx.lineWidth = 1.6;
      wctx.beginPath();
      wctx.moveTo(sxk + 8, gy); wctx.lineTo(sxk + 6 + hv*8, gy - 7 - hv*7);
      wctx.moveTo(sxk + 14, gy); wctx.lineTo(sxk + 18, gy - 5 - hv*4);
      wctx.stroke();
    } else if(hv > 0.62){
      wctx.fillStyle = '#252B12';
      wctx.beginPath();
      wctx.moveTo(sxk + 4, gy); wctx.lineTo(sxk + 11, gy - 6);
      wctx.lineTo(sxk + 19, gy); wctx.closePath(); wctx.fill();
      wctx.strokeStyle = 'rgba(204,254,6,0.30)'; wctx.lineWidth = 1; wctx.stroke();
    }
    if(k % 8 === 0){
      wctx.fillStyle = 'rgba(204,254,6,0.35)';
      wctx.fillRect(sxk + 2, gy + 5, 2, 2);
      wctx.fillRect(sxk + 20, gy + 5, 2, 2);
    }
    // distance markers every 640px
    if(k % 20 === 0){
      wctx.fillStyle = 'rgba(90,107,14,0.55)';
      wctx.font = '8px "IBM Plex Mono", monospace';
      wctx.fillText(String(k*TILE/10 | 0) + 'm', sxk + 3, gy + 20);
    }
  }
}

/* ======================= PROPS ======================= */
function drawBoxes(){
  for(var i=0;i<boxes.length;i++){
    var b = boxes[i], x = b.x - cam.x;
    if(x < -220 || x > cameraSpanW() + 220) continue;
    // contact shadow
    var gy = groundAt(b.x + b.w/2);
    wctx.fillStyle = 'rgba(0,0,0,0.45)';
    wctx.beginPath(); wctx.ellipse(x + b.w/2, gy + 3, b.w*0.6, 5, 0, 0, 6.283); wctx.fill();

    var bg = wctx.createLinearGradient(x, b.y, x + b.w, b.y + b.h);
    bg.addColorStop(0, '#232A15');
    bg.addColorStop(0.5, '#181D10');
    bg.addColorStop(1, '#0F1309');
    wctx.fillStyle = bg; wctx.fillRect(x, b.y, b.w, b.h);

    // corner brackets
    wctx.strokeStyle = COL.dim; wctx.lineWidth = 2;
    wctx.strokeRect(x + 1, b.y + 1, b.w - 2, b.h - 2);
    wctx.strokeStyle = rgba(COL.lime, 0.55); wctx.lineWidth = 2;
    var cl = 9;
    wctx.beginPath();
    wctx.moveTo(x+2, b.y+cl); wctx.lineTo(x+2, b.y+2); wctx.lineTo(x+cl, b.y+2);
    wctx.moveTo(x+b.w-cl, b.y+2); wctx.lineTo(x+b.w-2, b.y+2); wctx.lineTo(x+b.w-2, b.y+cl);
    wctx.stroke();

    // panel seams
    wctx.strokeStyle = 'rgba(0,0,0,0.5)'; wctx.lineWidth = 1;
    for(var v=1;v*40 < b.w;v++){
      wctx.beginPath(); wctx.moveTo(x + v*40, b.y + 3); wctx.lineTo(x + v*40, b.y + b.h - 3); wctx.stroke();
    }
    // top light strip
    wctx.fillStyle = rgba(COL.lime, 0.22);
    wctx.fillRect(x + 6, b.y + 5, b.w - 12, 3);
    // stencil
    wctx.fillStyle = 'rgba(204,254,6,0.55)';
    wctx.font = '600 9px "IBM Plex Mono", monospace';
    wctx.fillText('RWI', x + 7, b.y + b.h - 7);
    wctx.fillStyle = 'rgba(90,107,14,0.7)';
    wctx.font = '7px "IBM Plex Mono", monospace';
    wctx.fillText('CRATE-' + (100 + i), x + 7, b.y + b.h - 18);
    // hazard chevrons
    wctx.fillStyle = 'rgba(255,107,44,0.35)';
    for(var z=0;z<Math.floor(b.w/12);z++)
      wctx.fillRect(x + 4 + z*12, b.y + b.h - 4, 6, 2);
  }
}

function drawDrops(){
  for(var i=0;i<drops.length;i++){
    var d = drops[i], x = d.x - cam.x;
    if(x < -40 || x > cameraSpanW() + 40) continue;
    var pulse = 1 + Math.sin(d.t*0.14)*0.16;
    var col = (d.kind === 'repair' || d.kind === 'armor') ? COL.paper
              : ((d.kind === 'cell' || d.kind === 'aid') ? COL.warn : COL.lime);
    var gy = groundAt(d.x);
    wctx.fillStyle = 'rgba(0,0,0,0.4)';
    wctx.beginPath(); wctx.ellipse(x, gy + 2, 8, 2.6, 0, 0, 6.283); wctx.fill();

    wctx.save(); wctx.translate(x, d.y); wctx.rotate(d.t*0.03); wctx.scale(pulse, pulse);
    if(d.kind === 'solar'){
      wctx.fillStyle = rgba(COL.lime, 0.25);
      wctx.beginPath(); wctx.moveTo(0,-13); wctx.lineTo(12,0); wctx.lineTo(0,13); wctx.lineTo(-12,0);
      wctx.closePath(); wctx.fill();
      wctx.fillStyle = COL.lime; wctx.strokeStyle = COL.ink; wctx.lineWidth = 2;
      wctx.beginPath(); wctx.moveTo(0,-9); wctx.lineTo(8,0); wctx.lineTo(0,9); wctx.lineTo(-8,0);
      wctx.closePath(); wctx.fill(); wctx.stroke();
      wctx.fillStyle = COL.ink; wctx.fillRect(-1, -4, 2, 8);
    } else if(d.kind !== 'repair' && d.kind !== 'aid'){
      // power-up canister
      var pcol = d.kind === 'cell' ? COL.warn : (d.kind === 'armor' ? COL.paper : COL.lime);
      wctx.fillStyle = rgba(pcol, 0.22);
      wctx.beginPath(); wctx.arc(0, 0, 13, 0, 6.283); wctx.fill();
      wctx.fillStyle = COL.ink; wctx.strokeStyle = pcol; wctx.lineWidth = 2;
      wctx.beginPath();
      wctx.moveTo(-7,-5); wctx.lineTo(0,-9); wctx.lineTo(7,-5);
      wctx.lineTo(7,5); wctx.lineTo(0,9); wctx.lineTo(-7,5);
      wctx.closePath(); wctx.fill(); wctx.stroke();
      wctx.fillStyle = pcol;
      if(d.kind === 'overclock'){
        wctx.beginPath(); wctx.moveTo(1.5,-6); wctx.lineTo(-3.5,0.5);
        wctx.lineTo(-0.5,0.5); wctx.lineTo(-1.5,6); wctx.lineTo(3.5,-0.5);
        wctx.lineTo(0.5,-0.5); wctx.closePath(); wctx.fill();
      } else if(d.kind === 'barrier'){
        wctx.beginPath(); wctx.moveTo(0,-6); wctx.lineTo(4.5,-3.5);
        wctx.lineTo(4.5,2); wctx.lineTo(0,6); wctx.lineTo(-4.5,2);
        wctx.lineTo(-4.5,-3.5); wctx.closePath();
        wctx.lineWidth = 1.6; wctx.strokeStyle = pcol; wctx.stroke();
      } else if(d.kind === 'spread'){
        for(var sp2=-1;sp2<=1;sp2++){
          wctx.beginPath();
          wctx.moveTo(-4, sp2*3); wctx.lineTo(4, sp2*4.6);
          wctx.lineWidth = 1.5; wctx.strokeStyle = pcol; wctx.stroke();
        }
      } else if(d.kind === 'armor'){
        // layered plate
        wctx.beginPath();
        wctx.moveTo(0, -6); wctx.lineTo(5, -3.4); wctx.lineTo(5, 2.4);
        wctx.lineTo(0, 6); wctx.lineTo(-5, 2.4); wctx.lineTo(-5, -3.4);
        wctx.closePath(); wctx.fill();
        wctx.fillStyle = COL.ink;
        wctx.beginPath();
        wctx.moveTo(0, -3.2); wctx.lineTo(2.8, -1.6); wctx.lineTo(2.8, 1.4);
        wctx.lineTo(0, 3.4); wctx.lineTo(-2.8, 1.4); wctx.lineTo(-2.8, -1.6);
        wctx.closePath(); wctx.fill();
      } else if(d.kind === 'speed'){
        // double chevron
        for(var ch=0;ch<2;ch++){
          wctx.beginPath();
          wctx.moveTo(-4 + ch*3.6, -5);
          wctx.lineTo(1 + ch*3.6, 0);
          wctx.lineTo(-4 + ch*3.6, 5);
          wctx.lineTo(-2.2 + ch*3.6, 0);
          wctx.closePath(); wctx.fill();
        }
      } else {
        wctx.fillRect(-4, -5, 8, 10);
        wctx.fillStyle = COL.ink; wctx.fillRect(-2.4, -3, 4.8, 6);
      }
    } else {
      var aid = d.kind === 'aid';
      var crossLong = aid ? 7 : 9;
      var crossHalf = aid ? 2.5 : 3;
      wctx.fillStyle = aid ? COL.warn : COL.paper;
      wctx.fillRect(-crossHalf,-crossLong,crossHalf*2,crossLong*2);
      wctx.fillRect(-crossLong,-crossHalf,crossLong*2,crossHalf*2);
      wctx.strokeStyle = COL.ink; wctx.lineWidth = 1.5;
      wctx.strokeRect(-crossHalf,-crossLong,crossHalf*2,crossLong*2);
      wctx.strokeRect(-crossLong,-crossHalf,crossLong*2,crossHalf*2);
    }
    wctx.restore();
    addLight(x, d.y, 24, col, 0.30 + Math.sin(d.t*0.14)*0.08);
  }
}

/* ======================= ENEMIES ======================= */
function entShadow(worldX, y, w, alpha){
  var gy = groundAt(worldX);
  var h = clamp(1 - (gy - y) / 260, 0.15, 1);
  wctx.fillStyle = 'rgba(0,0,0,' + (0.42 * h * (alpha === undefined ? 1 : alpha)) + ')';
  wctx.beginPath();
  wctx.ellipse(worldX - cam.x, gy + 2, w*0.55*h + 4, 4*h + 1.5, 0, 0, 6.283);
  wctx.fill();
}

function drawFoes(){
  for(var i=0;i<foes.length;i++){
    var f = foes[i], x = f.x - cam.x;
    if(x < -140 || x > cameraSpanW() + 140) continue;
    var lit = f.hit > 0;
    var edge = lit ? COL.paper : COL.warn;
    var shell = lit ? COL.paper : '#2A1608';

    entShadow(f.x + f.w/2, f.y + f.h, f.w);
    wctx.save(); wctx.translate(x, f.y);

    if(f.kind === 'walker'){
      var sw = Math.sin(f.t)*4;
      // hydraulic legs
      wctx.strokeStyle = edge; wctx.lineWidth = 3.4; wctx.lineCap = 'round';
      wctx.beginPath();
      wctx.moveTo(10, 21); wctx.lineTo(10 - sw, 28); wctx.lineTo(9 - sw*1.4, 34);
      wctx.moveTo(20, 21); wctx.lineTo(20 + sw, 28); wctx.lineTo(21 + sw*1.4, 34);
      wctx.stroke(); wctx.lineCap = 'butt';
      wctx.fillStyle = edge;
      wctx.fillRect(5 - sw*1.4, 33, 9, 2.6);
      wctx.fillRect(17 + sw*1.4, 33, 9, 2.6);
      // chassis
      var wg = wctx.createLinearGradient(4, 4, 26, 24);
      wg.addColorStop(0, lit ? COL.paper : '#3E1E09');
      wg.addColorStop(1, shell);
      wctx.fillStyle = wg;
      wctx.beginPath();
      wctx.moveTo(4, 8); wctx.lineTo(10, 3); wctx.lineTo(24, 4); wctx.lineTo(27, 12);
      wctx.lineTo(24, 22); wctx.lineTo(6, 22); wctx.closePath();
      wctx.fill();
      wctx.strokeStyle = edge; wctx.lineWidth = 2; wctx.stroke();
      // vents + eye
      wctx.fillStyle = 'rgba(0,0,0,0.45)';
      wctx.fillRect(8, 17, 14, 1.6);
      wctx.fillStyle = lit ? COL.ink : COL.red;
      wctx.fillRect(9, 8, 13, 4.5);
      wctx.fillStyle = COL.paper;
      wctx.fillRect(f.vx > 0 ? 18 : 10, 8.6, 3, 3.2);
      if(!lit) addLight(f.x + 15, f.y + 10, 26, COL.red, 0.30);
      // charging tell
      if(f.cool < 16){
        wctx.fillStyle = rgba(COL.warn, 0.5 + Math.sin(frame*0.6)*0.4);
        wctx.beginPath(); wctx.arc(15, 11, 3 + Math.sin(frame*0.6)*1.2, 0, 6.283); wctx.fill();
        addLight(f.x + 15, f.y + 11, 34, COL.warn, 0.5);
      }
    }
    else if(f.kind === 'drone'){
      wctx.translate(14, 10);
      wctx.rotate(clamp(f.vx*0.06, -0.35, 0.35));
      // rotor blur
      wctx.globalAlpha = 0.35; wctx.strokeStyle = COL.warn; wctx.lineWidth = 1.6;
      var bl = 10 + Math.abs(Math.sin(f.t*9))*7;
      wctx.beginPath();
      wctx.moveTo(-14, -5); wctx.lineTo(-14 - bl, -5);
      wctx.moveTo(14, -5); wctx.lineTo(14 + bl, -5);
      wctx.stroke(); wctx.globalAlpha = 1;
      // hull
      var dgd = wctx.createLinearGradient(0, -10, 0, 10);
      dgd.addColorStop(0, lit ? COL.paper : '#43220B');
      dgd.addColorStop(1, shell);
      wctx.fillStyle = dgd;
      wctx.beginPath();
      wctx.moveTo(0, -10); wctx.lineTo(14, -1); wctx.lineTo(9, 9); wctx.lineTo(-9, 9); wctx.lineTo(-14, -1);
      wctx.closePath(); wctx.fill();
      wctx.strokeStyle = edge; wctx.lineWidth = 2; wctx.stroke();
      // sensor
      wctx.fillStyle = lit ? COL.ink : COL.red;
      wctx.beginPath(); wctx.arc(0, 0, 4, 0, 6.283); wctx.fill();
      wctx.fillStyle = COL.paper;
      wctx.beginPath(); wctx.arc(-1.2, -1.2, 1.3, 0, 6.283); wctx.fill();
      wctx.strokeStyle = edge; wctx.lineWidth = 1;
      wctx.beginPath(); wctx.arc(0, 0, 6, 0, 6.283); wctx.stroke();
      // underglow
      wctx.fillStyle = rgba(COL.warn, 0.5);
      wctx.fillRect(-6, 9, 12, 1.6);
      if(!lit){
        addLight(f.x + 14, f.y + 10, 28, COL.red, 0.28);
        addLight(f.x + 14, f.y + 20, 22, COL.warn, 0.20);
      }
    }
    else if(f.kind === 'mortar'){
      wctx.fillStyle = lit ? COL.paper : '#2A1608';
      wctx.strokeStyle = edge; wctx.lineWidth = 2;
      wctx.beginPath();
      wctx.moveTo(0, 28); wctx.lineTo(4, 12); wctx.lineTo(28, 12); wctx.lineTo(32, 28);
      wctx.closePath(); wctx.fill(); wctx.stroke();
      // elevated tube
      wctx.save(); wctx.translate(16, 13); wctx.rotate(-1.05 * (f.x < player.x ? 1 : -1));
      wctx.fillStyle = lit ? COL.paper : '#3E1E09';
      wctx.fillRect(-4, -16, 8, 18);
      wctx.strokeRect(-4, -16, 8, 18);
      wctx.fillStyle = edge; wctx.fillRect(-5, -17, 10, 3);
      wctx.restore();
      wctx.fillStyle = f.cool < 24 ? COL.warn : COL.red;
      wctx.beginPath(); wctx.arc(16, 21, 3.2, 0, 6.283); wctx.fill();
      if(!lit) addLight(f.x + 16, f.y + 21, 26, COL.red, 0.3);
    }
    else if(f.kind === 'lancer'){
      var charging = f.chg > 0;
      wctx.fillStyle = lit ? COL.paper : (charging ? '#5A2A08' : '#2A1608');
      wctx.strokeStyle = edge; wctx.lineWidth = 2;
      // wedge hull
      wctx.beginPath();
      wctx.moveTo(f.vx >= 0 ? 28 : 0, 13);
      wctx.lineTo(f.vx >= 0 ? 6 : 22, 3);
      wctx.lineTo(f.vx >= 0 ? 0 : 28, 13);
      wctx.lineTo(f.vx >= 0 ? 6 : 22, 24);
      wctx.closePath(); wctx.fill(); wctx.stroke();
      // ram spike
      wctx.fillStyle = edge;
      wctx.beginPath();
      wctx.moveTo(f.vx >= 0 ? 26 : 2, 10);
      wctx.lineTo(f.vx >= 0 ? 36 : -8, 13);
      wctx.lineTo(f.vx >= 0 ? 26 : 2, 16);
      wctx.closePath(); wctx.fill();
      wctx.fillStyle = lit ? COL.ink : COL.red;
      wctx.fillRect(10, 10, 8, 4);
      if(charging){
        addLight(f.x + 14, f.y + 13, 60, COL.warn, 0.75);
        wctx.strokeStyle = rgba(COL.warn, 0.5); wctx.lineWidth = 2;
        wctx.beginPath();
        wctx.moveTo(f.vx >= 0 ? 0 : 28, 13);
        wctx.lineTo(f.vx >= 0 ? -22 : 50, 13); wctx.stroke();
      } else if(!lit) addLight(f.x + 14, f.y + 13, 28, COL.red, 0.3);
    }
    else { // turret
      // base plinth
      wctx.fillStyle = '#1A1209';
      wctx.beginPath();
      wctx.moveTo(-2, 26); wctx.lineTo(4, 14); wctx.lineTo(30, 14); wctx.lineTo(36, 26);
      wctx.closePath(); wctx.fill();
      wctx.strokeStyle = edge; wctx.lineWidth = 2; wctx.stroke();
      wctx.fillStyle = 'rgba(255,107,44,0.30)';
      for(var z=0;z<4;z++) wctx.fillRect(2 + z*8, 22, 5, 2);
      // rotating barrel
      wctx.save(); wctx.translate(17, 13); wctx.rotate(f.t || 0);
      var kick = f.cool > 100 ? -2.5 : 0;
      wctx.fillStyle = shell;
      wctx.fillRect(kick, -4.5, 24, 9);
      wctx.strokeStyle = edge; wctx.lineWidth = 1.8;
      wctx.strokeRect(kick, -4.5, 24, 9);
      wctx.fillStyle = edge;
      wctx.fillRect(kick + 20, -5.5, 3, 11);
      wctx.restore();
      // housing dome
      var tg2 = wctx.createRadialGradient(14, 8, 1, 17, 12, 10);
      tg2.addColorStop(0, lit ? COL.paper : '#54290C');
      tg2.addColorStop(1, shell);
      wctx.fillStyle = tg2;
      wctx.beginPath(); wctx.arc(17, 12, 8, 0, 6.283); wctx.fill();
      wctx.strokeStyle = edge; wctx.lineWidth = 2; wctx.stroke();
      wctx.fillStyle = lit ? COL.ink : COL.red;
      wctx.beginPath(); wctx.arc(17, 12, 3.2, 0, 6.283); wctx.fill();
      if(!lit) addLight(f.x + 17, f.y + 12, 28, COL.red, 0.30);
      if(f.cool < 22){
        addLight(f.x + 17, f.y + 12, 42, COL.warn, 0.5);
        wctx.strokeStyle = rgba(COL.red, 0.35);
        wctx.lineWidth = 1;
        wctx.save(); wctx.translate(17, 12); wctx.rotate(f.t || 0);
        wctx.beginPath(); wctx.moveTo(24, 0); wctx.lineTo(400, 0); wctx.stroke();
        wctx.restore();
      }
    }
    wctx.restore();
  }
}

/* ======================= BOSS ======================= */
function drawBossMech(){
  if(!boss) return;
  var b = boss, x = b.x - cam.x, y = b.y;
  var lit = b.hit > 0;
  var edge = lit ? COL.paper : COL.warn;
  var dmg = 1 - b.hp / b.maxhp;

  entShadow(b.x + b.w/2, b.y + b.h, b.w, 0.8);
  wctx.save(); wctx.translate(x, y);

  // thruster plumes
  var fl = 14 + Math.sin(b.t*0.6)*9 + (b.mode === 'charge' ? 16 : 0);
  for(var t2=0;t2<2;t2++){
    var tx = 34 + t2*62;
    var pg = wctx.createLinearGradient(tx, 112, tx, 112 + fl*2);
    pg.addColorStop(0, rgba(COL.warn, 0.85));
    pg.addColorStop(0.4, rgba(COL.red, 0.45));
    pg.addColorStop(1, rgba(COL.red, 0));
    wctx.fillStyle = pg;
    wctx.beginPath(); wctx.moveTo(tx - 9, 112); wctx.lineTo(tx + 9, 112);
    wctx.lineTo(tx + 3, 112 + fl*2); wctx.lineTo(tx - 3, 112 + fl*2); wctx.closePath(); wctx.fill();
    addLight(b.x + tx, b.y + 122, 58, COL.warn, 0.40);
  }

  // engine housings
  wctx.fillStyle = '#22140A'; wctx.strokeStyle = edge; wctx.lineWidth = 2;
  wctx.fillRect(22, 92, 26, 22); wctx.strokeRect(22, 92, 26, 22);
  wctx.fillRect(84, 92, 26, 22); wctx.strokeRect(84, 92, 26, 22);

  // shoulder pods (open when volleying)
  var open = (b.mode === 'volley') ? 8 : 0;
  for(var sIdx=0;sIdx<2;sIdx++){
    var sx2 = sIdx ? 112 : -8, dir = sIdx ? 1 : -1;
    wctx.save(); wctx.translate(sx2 + (sIdx?0:0) + dir*open*0.5, 30);
    var sg2 = wctx.createLinearGradient(0, 0, 0, 40);

  // torso

  wctx.beginPath();

  wctx.lineTo(108, 96); wctx.lineTo(22, 96); wctx.lineTo(4, 60);

  wctx.strokeStyle = edge; wctx.lineWidth = 3; wctx.stroke();

  // armour seams + rivets
  wctx.strokeStyle = 'rgba(0,0,0,0.5)'; wctx.lineWidth = 1.4;
  wctx.beginPath();
  wctx.moveTo(20, 44); wctx.lineTo(110, 44);
  wctx.moveTo(26, 80); wctx.lineTo(104, 80);
  wctx.moveTo(65, 24); wctx.lineTo(65, 44);
  wctx.stroke();
  wctx.fillStyle = 'rgba(255,107,44,0.30)';
  for(var rv=0;rv<9;rv++) wctx.fillRect(22 + rv*10, 47, 2.5, 2.5);

  // hazard stripes on the belly
  wctx.save();
  wctx.beginPath(); wctx.rect(26, 82, 78, 12); wctx.clip();
  for(var hstripe=0;hstripe<14;hstripe++){
    wctx.fillStyle = hstripe % 2 ? 'rgba(255,107,44,0.45)' : 'rgba(11,11,9,0.5)';
    wctx.save(); wctx.translate(20 + hstripe*8, 82); wctx.rotate(0.5);
    wctx.fillRect(0, -6, 5, 26); wctx.restore();
  }
  wctx.restore();

  // head
  wctx.fillStyle = COL.ink; wctx.fillRect(44, 4, 42, 22);
  wctx.strokeStyle = edge; wctx.lineWidth = 2; wctx.strokeRect(44, 4, 42, 22);
  var eyeCol = b.mode === 'charge' ? COL.red : COL.warn;
  var eyePulse = b.mode === 'charge' ? (0.55 + Math.abs(Math.sin(b.t*0.35))*0.45) : 0.9;
  wctx.fillStyle = rgba(eyeCol, eyePulse);
  wctx.fillRect(50, 11, 30, 8);
  wctx.fillStyle = COL.paper;
  wctx.fillRect(b.vx > 0 ? 70 : 52, 12, 6, 6);
  addLight(b.x + 65, b.y + 15, 84, eyeCol, 0.38 * eyePulse);

  // reactor core
  var coreR = 18 + Math.sin(b.t*0.12)*2;
  wctx.fillStyle = COL.ink;
  wctx.beginPath(); wctx.arc(65, 62, coreR, 0, 6.283); wctx.fill();
  wctx.strokeStyle = COL.lime; wctx.lineWidth = 2; wctx.stroke();
  var cg2 = wctx.createRadialGradient(65, 62, 2, 65, 62, 14);
  cg2.addColorStop(0, rgba(COL.paper, 0.9));
  cg2.addColorStop(0.4, rgba(COL.red, 0.8));
  cg2.addColorStop(1, rgba(COL.red, 0.15));
  wctx.fillStyle = cg2;
  wctx.beginPath(); wctx.arc(65, 62, 14, 0, 6.283); wctx.fill();

  wctx.strokeStyle = rgba(COL.warn, 0.8); wctx.lineWidth = 1.4;
  for(var ir=0;ir<6;ir++){
    var ia = b.t*0.02 + ir*1.047;
    wctx.beginPath();
    wctx.moveTo(65 + Math.cos(ia)*7, 62 + Math.sin(ia)*7);
    wctx.lineTo(65 + Math.cos(ia)*coreR, 62 + Math.sin(ia)*coreR);

  addLight(b.x + 65, b.y + 62, 110, COL.red, 0.38 + Math.sin(b.t*0.12)*0.10);

  if(dmg > 0.72){
    if(frame % 5 === 0) spark(b.x + 96, b.y + 40, rr(-2,2), rr(-1,2), COL.warn, 22, 1.6);
    wctx.strokeStyle = 'rgba(0,0,0,0.75)'; wctx.lineWidth = 4;
    wctx.beginPath(); wctx.moveTo(100, 34); wctx.lineTo(84, 58); wctx.stroke();

  // charge telegraph beam
  if(b.mode === 'charge' && b.charge > 0){
